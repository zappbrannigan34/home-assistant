# package: puh_9105_humidity_multiroom
# Version: 4.5.0
# Last Updated: 2026-11-25
# Changes: Honest predictive ON/OFF (0%/100%) controller for sleep mode without fake 0..7 scale or hardcoded 6; direct evaporation_rate_ml_h calibration via active_hours

# ──────────────────────────────────────────────────────────────────────────────
#  INPUT BOOLEANS (целевой режим + состояние "бак пуст, ждём заправки")
#  ВАЖНО: без initial:, чтобы HA восстанавливал пользовательские значения из .storage
# ──────────────────────────────────────────────────────────────────────────────

input_boolean:
  # Eva (legacy room)
  humidity_adaptive_target:
    name: "Humidity Adaptive Target"
    icon: mdi:auto-fix

  humidifier_needs_refill:
    name: "Humidifier Needs Refill"
    icon: mdi:water-off

  humidifier_low_water_warned:
    name: "Humidifier Low Water 15% Warned"
    icon: mdi:water-alert

  humidifier_full_cycle_valid:
    name: "Humidifier Full Tank Cycle Valid"
    icon: mdi:check-decagram

  # Zap
  humidity_zap_adaptive_target:
    name: "Humidity Zap Adaptive Target"
    icon: mdi:auto-fix

  humidifier_zap_needs_refill:
    name: "Humidifier Zap Needs Refill"
    icon: mdi:water-off

  humidifier_zap_low_water_warned:
    name: "Humidifier Zap Low Water 15% Warned"
    icon: mdi:water-alert

  humidifier_zap_full_cycle_valid:
    name: "Humidifier Zap Full Tank Cycle Valid"
    icon: mdi:check-decagram

# ──────────────────────────────────────────────────────────────────────────────
#  INPUT NUMBERS (целевая влажность и калибровка баков)
#  ВАЖНО: без initial:, чтобы значения сохранялись между перезагрузками HA
# ──────────────────────────────────────────────────────────────────────────────

input_number:
  # Eva (legacy room)
  humidity_target:
    name: "Humidity Target"
    min: 25
    max: 70
    step: 1
    unit_of_measurement: "%"
    icon: mdi:water-percent
    mode: box

  humidifier_tank_capacity_ml:
    name: "Humidifier Tank Capacity (fixed)"
    min: 2000
    max: 8000
    step: 100
    unit_of_measurement: "ml"
    mode: box

  humidifier_calibration_cycles:
    name: "Humidifier Rate Calibration Cycles"
    min: 0
    max: 20
    step: 1
    mode: box

  humidifier_evaporation_rate_ml_h:
    name: "Humidifier Evaporation Rate"
    min: 250
    max: 650
    step: 0.1
    unit_of_measurement: "ml/h"
    icon: mdi:water-sync
    mode: box

  # Zap
  humidity_zap_target:
    name: "Humidity Zap Target"
    min: 25
    max: 70
    step: 1
    unit_of_measurement: "%"
    icon: mdi:water-percent
    mode: box

  humidifier_zap_tank_capacity_ml:
    name: "Humidifier Zap Tank Capacity (fixed)"
    min: 2000
    max: 8000
    step: 100
    unit_of_measurement: "ml"
    mode: box

  humidifier_zap_calibration_cycles:
    name: "Humidifier Zap Rate Calibration Cycles"
    min: 0
    max: 20
    step: 1
    mode: box

  humidifier_zap_evaporation_rate_ml_h:
    name: "Humidifier Zap Evaporation Rate"
    min: 250
    max: 650
    step: 0.1
    unit_of_measurement: "ml/h"
    icon: mdi:water-sync
    mode: box

# ──────────────────────────────────────────────────────────────────────────────
#  INPUT TEXT (результат последней калибровки, persisted as JSON)
#  ВАЖНО: без initial:, чтобы калибровка не затиралась при рестарте HA
# ──────────────────────────────────────────────────────────────────────────────

input_text:
  # Eva (legacy room)
  humidifier_last_calibration:
    name: "Humidifier Last Calibration Result (JSON)"
    max: 255

  # Zap
  humidifier_zap_last_calibration:
    name: "Humidifier Zap Last Calibration Result (JSON)"
    max: 255

# ──────────────────────────────────────────────────────────────────────────────
#  INPUT DATETIME (начало цикла для history_stats)
# ──────────────────────────────────────────────────────────────────────────────

input_datetime:
  # Eva (legacy room)
  humidifier_cycle_start:
    name: "Humidifier Cycle Start Time"
    has_date: true
    has_time: true

  # Zap
  humidifier_zap_cycle_start:
    name: "Humidifier Zap Cycle Start Time"
    has_date: true
    has_time: true

# ──────────────────────────────────────────────────────────────────────────────
#  HISTORY STATS — фактическая наработка (часы работы) за текущий цикл
# ──────────────────────────────────────────────────────────────────────────────

sensor:
  # Eva (legacy room)
  - platform: history_stats
    name: "Humidifier Active Hours"
    entity_id: humidifier.humidifier_puh_9105_puh_2709_humidifier
    state: "on"
    type: time
    start: >
      {{ states('input_datetime.humidifier_cycle_start') | as_datetime | default(today_at('00:00'), true) }}
    end: "{{ now() }}"

  # Zap
  - platform: history_stats
    name: "Humidifier Zap Active Hours"
    entity_id: humidifier.humidifier_puh_9105_puh_2709_humidifier_2
    state: "on"
    type: time
    start: >
      {{ states('input_datetime.humidifier_zap_cycle_start') | as_datetime | default(today_at('00:00'), true) }}
    end: "{{ now() }}"

  # ──────────────────────────────────────────────────────────────────────────
  #  FILTER & DERIVATIVE SENSORS (сглаживание сигнала влажности по аналогии с CO2)
  #  WirenBoard обновляет влажность каждые ~10.5 с → lowpass time_constant: 18 (~3 мин)
  # ──────────────────────────────────────────────────────────────────────────
  # Eva (legacy room)
  - platform: filter
    name: "Humidity Filtered"
    unique_id: humidity_filtered
    entity_id: sensor.sensor_eva_humidity
    filters:
      - filter: lowpass
        time_constant: 18
        precision: 2

  - platform: derivative
    source: sensor.humidity_filtered
    name: "Humidity Slope"
    unique_id: humidity_slope
    round: 3
    unit_time: min
    time_window: "00:05:00"

  # Zap
  - platform: filter
    name: "Humidity Zap Filtered"
    unique_id: humidity_zap_filtered
    entity_id: sensor.sensor_zap_humidity
    filters:
      - filter: lowpass
        time_constant: 18
        precision: 2

  - platform: derivative
    source: sensor.humidity_zap_filtered
    name: "Humidity Zap Slope"
    unique_id: humidity_zap_slope
    round: 3
    unit_time: min
    time_window: "00:05:00"

# ──────────────────────────────────────────────────────────────────────────────
#  TEMPLATE SENSORS
# ──────────────────────────────────────────────────────────────────────────────

template:
  # ════════════════════════════════════════════════════════════════════════════
  #  EVA — БЛОК 1: РАСЧЁТ СКОРОСТИ ИЗМЕНЕНИЯ ВЛАЖНОСТИ
  # ════════════════════════════════════════════════════════════════════════════
  - trigger:
      - platform: time_pattern
        minutes: "/1"
      - platform: homeassistant
        event: start
    sensor:
      - name: "Humidity Rate"
        unique_id: humidity_rate
        unit_of_measurement: "%/min"
        state_class: measurement
        icon: mdi:trending-up
        state: >
          {% set attrs = this.attributes if (this is defined and this.attributes is defined) else {} %}
          {% set current = (states('sensor.humidity_filtered') if has_value('sensor.humidity_filtered') else states('sensor.sensor_eva_humidity')) | float(none) %}
          {% set prev_rate = (this.state if (this is defined and this.state is defined) else 0) | float(0) %}
          {% if current is none %}
            {{ prev_rate }}
          {% else %}
            {# Берём значение 5 минут назад (5 шагов × 1 мин) #}
            {% set old = attrs.get('h5', current) | float(current) %}
            {% set rate = (current - old) / 5 %}
            {# EMA сглаживание для уменьшения шума #}
            {{ (0.4 * rate + 0.6 * prev_rate) | round(3) }}
          {% endif %}
        attributes:
          # Кольцевой буфер: каждую 1 мин сдвигаем историю по сглаженному сигналу
          h1: "{{ (states('sensor.humidity_filtered') if has_value('sensor.humidity_filtered') else states('sensor.sensor_eva_humidity')) | float(0) }}"
          h2: "{{ (this.attributes.get('h1') if (this is defined and this.attributes is defined) else none) | default(states('sensor.humidity_filtered') if has_value('sensor.humidity_filtered') else states('sensor.sensor_eva_humidity'), true) | float(0) }}"
          h3: "{{ (this.attributes.get('h2') if (this is defined and this.attributes is defined) else none) | default(states('sensor.humidity_filtered') if has_value('sensor.humidity_filtered') else states('sensor.sensor_eva_humidity'), true) | float(0) }}"
          h4: "{{ (this.attributes.get('h3') if (this is defined and this.attributes is defined) else none) | default(states('sensor.humidity_filtered') if has_value('sensor.humidity_filtered') else states('sensor.sensor_eva_humidity'), true) | float(0) }}"
          h5: "{{ (this.attributes.get('h4') if (this is defined and this.attributes is defined) else none) | default(states('sensor.humidity_filtered') if has_value('sensor.humidity_filtered') else states('sensor.sensor_eva_humidity'), true) | float(0) }}"
          current_humidity: "{{ (states('sensor.humidity_filtered') if has_value('sensor.humidity_filtered') else states('sensor.sensor_eva_humidity')) | float(0) }}"
          raw_humidity: "{{ states('sensor.sensor_eva_humidity') | float(0) | round(2) }}"
          filtered_humidity: "{{ (states('sensor.humidity_filtered') if has_value('sensor.humidity_filtered') else states('sensor.sensor_eva_humidity')) | float(0) | round(2) }}"
          derivative_slope_5m: "{{ states('sensor.humidity_slope') | float(0) | round(3) }}"
          filter_type: "ema_lowpass"
          minutes_window: 5

  # ════════════════════════════════════════════════════════════════════════════
  #  EVA — БЛОК 2: ЦЕЛЬ И ОШИБКА РЕГУЛИРОВАНИЯ
  # ════════════════════════════════════════════════════════════════════════════
  - trigger:
      - platform: state
        entity_id:
          - sensor.humidity_filtered
          - sensor.sensor_eva_temperature
          - input_boolean.humidity_adaptive_target
          - input_number.humidity_target
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/1"
    sensor:
      # Адаптивная формула по комнатной температуре без конденсатного урезания (35–60%)
      - name: "Adaptive Target Humidity"
        unique_id: adaptive_target_humidity
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:water-thermometer-outline
        availability: >
          {{ has_value('sensor.sensor_eva_temperature') }}
        state: >
          {% set T_room = states('sensor.sensor_eva_temperature') | float(22) %}
          {% set base_indoor = 75 - (1.25 * T_room) %}
          {% set target = [base_indoor, 60] | min | float %}
          {{ ([target, 35] | max) | round(1) }}

      # Действующая цель (адаптивная или ручная с автопереключением)
      - name: "Target Humidity"
        unique_id: humidity_effective_target
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:water-check
        availability: >
          {{ has_value('input_number.humidity_target') or
             (is_state('input_boolean.humidity_adaptive_target', 'on') and
              has_value('sensor.sensor_eva_temperature')) }}
        state: >
          {% set adaptive_on = is_state('input_boolean.humidity_adaptive_target', 'on') %}
          {% set has_adaptive_inputs = has_value('sensor.sensor_eva_temperature') %}
          {% if adaptive_on and has_adaptive_inputs %}
            {% set T_room = states('sensor.sensor_eva_temperature') | float(22) %}
            {% set base_indoor = 75 - (1.25 * T_room) %}
            {% set target = [base_indoor, 60] | min | float %}
            {{ ([target, 35] | max) | round(1) }}
          {% else %}
            {{ states('input_number.humidity_target') | float(35) | round(1) }}
          {% endif %}
        attributes:
          controller_version: "4.5.0"
          area_id: "eva"
          target_mode: >
            {% if is_state('input_boolean.humidity_adaptive_target', 'on') %}
              {% if has_value('sensor.sensor_eva_temperature') %}
                adaptive
              {% else %}
                manual_fallback
              {% endif %}
            {% else %}
              manual
            {% endif %}
          manual_target: "{{ states('input_number.humidity_target') | float(35) | round(1) }}"
          adaptive_target: >
            {% if has_value('sensor.sensor_eva_temperature') %}
              {% set T_room = states('sensor.sensor_eva_temperature') | float(22) %}
              {% set base_indoor = 75 - (1.25 * T_room) %}
              {% set target = [base_indoor, 60] | min | float %}
              {{ ([target, 35] | max) | round(1) }}
            {% else %}
              unknown
            {% endif %}

      # Ошибка регулирования (считается inline по сглаженному сигналу без 1-tick лага)
      - name: "Humidity Error"
        unique_id: humidity_error
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:delta
        availability: >
          {{ (has_value('sensor.humidity_filtered') or has_value('sensor.sensor_eva_humidity')) and
             (has_value('input_number.humidity_target') or
              (is_state('input_boolean.humidity_adaptive_target', 'on') and
               has_value('sensor.sensor_eva_temperature'))) }}
        state: >
          {% set adaptive_on = is_state('input_boolean.humidity_adaptive_target', 'on') %}
          {% set has_adaptive_inputs = has_value('sensor.sensor_eva_temperature') %}
          {% if adaptive_on and has_adaptive_inputs %}
            {% set T_room = states('sensor.sensor_eva_temperature') | float(22) %}
            {% set base_indoor = 75 - (1.25 * T_room) %}
            {% set target = [[base_indoor, 60] | min | float, 35] | max %}
          {% else %}
            {% set target = states('input_number.humidity_target') | float(35) %}
          {% endif %}
          {% set current = (states('sensor.humidity_filtered') if has_value('sensor.humidity_filtered') else states('sensor.sensor_eva_humidity')) | float(50) %}
          {{ (target - current) | round(2) }}
        attributes:
          raw_humidity: "{{ states('sensor.sensor_eva_humidity') | float(0) | round(2) }}"
          filtered_humidity: "{{ (states('sensor.humidity_filtered') if has_value('sensor.humidity_filtered') else states('sensor.sensor_eva_humidity')) | float(0) | round(2) }}"
          target_humidity: "{{ states('sensor.target_humidity') | float(35) | round(1) }}"
          error_source: "filtered_humidity_error"

  # ════════════════════════════════════════════════════════════════════════════
  #  EVA — БЛОК 3: ПРЕДИКТИВНЫЙ ON/OFF-РЕГУЛЯТОР (0% / 100%) ПО AREA DEVICES
  # ════════════════════════════════════════════════════════════════════════════
  - trigger:
      - platform: state
        entity_id:
          - sensor.humidity_error
          - sensor.humidity_rate
          - humidifier.humidifier_puh_9105_puh_2709_humidifier
          - switch.humidifier_puh_9105_puh_2709_power
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/1"
    sensor:
      - name: "Recommended Intensity"
        unique_id: humidity_recommended_intensity
        unit_of_measurement: "%"
        icon: mdi:gauge
        availability: >
          {% set ns = namespace(has_hum=false) %}
          {% for dev in area_devices('eva') %}
            {% set ents = device_entities(dev) %}
            {% set hum = ents | select('match', '^humidifier\\.') | first | default('') %}
            {% if hum != '' and states(hum) not in ['unavailable', 'unknown'] %}
              {% set ns.has_hum = true %}
            {% endif %}
          {% endfor %}
          {{ has_value('sensor.humidity_error') and
             has_value('sensor.humidity_rate') and
             ns.has_hum }}
        state: >
          {% set error = states('sensor.humidity_error') | float(0) %}
          {% set rate = states('sensor.humidity_rate') | float(0) %}
          {% set ns_dev = namespace(has_on=false) %}
          {% for dev in area_devices('eva') %}
            {% set ents = device_entities(dev) %}
            {% set hum = ents | select('match', '^humidifier\\.') | first | default('') %}
            {% if hum != '' %}
              {% set pwr = ents | select('match', '^switch\\..*_power(_\\d+)?$') | first | default('') %}
              {% if is_state(hum, 'on') or (pwr != '' and is_state(pwr, 'on')) %}
                {% set ns_dev.has_on = true %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {% set prev_demand = ((this.state | int(0)) > 0) if (this is defined and this.state is defined and this.state not in ['unknown', 'unavailable']) else ns_dev.has_on %}
          {% set predicted_error = error - (rate * 5) %}
          {% if prev_demand %}
            {% if error <= -0.35 or (error <= 0.0 and predicted_error <= -0.35) %}
              0
            {% else %}
              100
            {% endif %}
          {% else %}
            {% if error >= 0.30 or (error >= 0.10 and predicted_error >= 0.50) %}
              100
            {% else %}
              0
            {% endif %}
          {% endif %}
        attributes:
          controller_version: "4.5.0"
          area_id: "eva"
          device_count: >
            {% set ns = namespace(cnt=0) %}
            {% for dev in area_devices('eva') %}
              {% if device_entities(dev) | select('match', '^humidifier\\.') | list | count > 0 %}
                {% set ns.cnt = ns.cnt + 1 %}
              {% endif %}
            {% endfor %}
            {{ ns.cnt }}
          active_devices: >
            {% set ns = namespace(cnt=0) %}
            {% for dev in area_devices('eva') %}
              {% set ents = device_entities(dev) %}
              {% set hum = ents | select('match', '^humidifier\\.') | first | default('') %}
              {% if hum != '' %}
                {% set pwr = ents | select('match', '^switch\\..*_power(_\\d+)?$') | first | default('') %}
                {% if is_state(hum, 'on') or (pwr != '' and is_state(pwr, 'on')) %}
                  {% set ns.cnt = ns.cnt + 1 %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.cnt }}
          raw_humidity: "{{ states('sensor.sensor_eva_humidity') | float(0) | round(2) }}"
          filtered_humidity: "{{ (states('sensor.humidity_filtered') if has_value('sensor.humidity_filtered') else states('sensor.sensor_eva_humidity')) | float(0) | round(2) }}"
          error: "{{ states('sensor.humidity_error') | float(0) }}"
          rate: "{{ states('sensor.humidity_rate') | float(0) }}"
          predicted_error: >
            {% set error = states('sensor.humidity_error') | float(0) %}
            {% set rate = states('sensor.humidity_rate') | float(0) %}
            {{ (error - (rate * 5)) | round(2) }}
          control_mode: >
            {% set error = states('sensor.humidity_error') | float(0) %}
            {% set rate = states('sensor.humidity_rate') | float(0) %}
            {% set predicted = error - (rate * 5) %}
            {% if predicted > 0.5 %}
              humidifying
            {% elif predicted < -0.5 %}
              drying
            {% else %}
              stable
            {% endif %}
          overshoot: >
            {% set error = states('sensor.humidity_error') | float(0) %}
            {{ error < -0.5 }}
          overshoot_pct: >
            {% set error = states('sensor.humidity_error') | float(0) %}
            {{ ([0, -error] | max) | round(2) }}

  # ════════════════════════════════════════════════════════════════════════════
  #  EVA — БЛОК 4: ВИРТУАЛЬНЫЙ СЕНСОР УРОВНЯ ВОДЫ
  # ════════════════════════════════════════════════════════════════════════════
  - trigger:
      - platform: time_pattern
        minutes: "/1"
        id: "tick"
      - platform: state
        entity_id: input_boolean.humidifier_needs_refill
        to: "off"
        id: "refill_confirmed"
      - platform: event
        event_type: humidity_refill_reset
        event_data:
          room: "eva"
        id: "refill_event"
      - platform: state
        entity_id: switch.humidifier_puh_9105_puh_2709_power
        id: "power_change"
      - platform: state
        entity_id: humidifier.humidifier_puh_9105_puh_2709_humidifier
        id: "humidifier_change"
      - platform: state
        entity_id: binary_sensor.humidifier_puh_9105_puh_2709_water_tank
        id: "tank_change"
    sensor:
      - name: "Humidifier Water Consumed"
        unique_id: humidifier_water_consumed_ml
        unit_of_measurement: "ml"
        state_class: total
        icon: mdi:water-minus
        state: >
          {% set current = (this.state if (this is defined and this.state is defined) else 0) | float(0) %}
          {% if trigger is not defined %}
            {{ current }}
          {% else %}
            {% set tank_removed = is_state('binary_sensor.humidifier_puh_9105_puh_2709_water_tank', 'on') %}
            {% set power_on = is_state('humidifier.humidifier_puh_9105_puh_2709_humidifier', 'on') or is_state('switch.humidifier_puh_9105_puh_2709_power', 'on') %}
            {% set error = states('sensor.humidifier_puh_9105_puh_2709_error') %}

            {% if trigger.id in ['refill_confirmed', 'refill_event'] %}
              {{ 0 }}
            {% elif trigger.id == 'tick'
                and power_on
                and not tank_removed
                and error in ['no_error', '00', '02', 'child_lock', ''] %}
              {% set rate_ml_h = states('input_number.humidifier_evaporation_rate_ml_h') | float(500.0) %}
              {{ (current + (rate_ml_h / 60.0)) | round(1) }}
            {% else %}
              {{ current }}
            {% endif %}
          {% endif %}

      - name: "Humidifier Water Level"
        unique_id: humidifier_water_level_pct
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:water-percent
        state: >
          {% if is_state('input_boolean.humidifier_needs_refill', 'on')
                or states('sensor.humidifier_puh_9105_puh_2709_error') in ['01', 'low_water'] %}
            {{ 0 }}
          {% else %}
            {% set capacity = states('input_number.humidifier_tank_capacity_ml') | float(5000) %}
            {% set consumed = states('sensor.humidifier_water_consumed') | float(0) %}
            {{ [0, (((capacity - consumed) / capacity) * 100)] | max | round(0) }}
          {% endif %}
        attributes:
          capacity_ml: "{{ states('input_number.humidifier_tank_capacity_ml') | float(5000) | round(0) }}"
          consumed_ml: "{{ states('sensor.humidifier_water_consumed') | float(0) | round(0) }}"
          remaining_ml: >
            {% if is_state('input_boolean.humidifier_needs_refill', 'on')
                  or states('sensor.humidifier_puh_9105_puh_2709_error') in ['01', 'low_water'] %}
              {{ 0 }}
            {% else %}
              {% set capacity = states('input_number.humidifier_tank_capacity_ml') | float(5000) %}
              {% set consumed = states('sensor.humidifier_water_consumed') | float(0) %}
              {{ [0, (capacity - consumed)] | max | round(0) }}
            {% endif %}
          evaporation_rate_ml_h: "{{ states('input_number.humidifier_evaporation_rate_ml_h') | float(500.0) | round(1) }}"
          active_hours: "{{ states('sensor.humidifier_active_hours') | float(0) | round(2) }}"
          hours_remaining: >
            {% if is_state('input_boolean.humidifier_needs_refill', 'on')
                  or states('sensor.humidifier_puh_9105_puh_2709_error') in ['01', 'low_water'] %}
              {{ 0.0 }}
            {% else %}
              {% set capacity = states('input_number.humidifier_tank_capacity_ml') | float(5000) %}
              {% set consumed = states('sensor.humidifier_water_consumed') | float(0) %}
              {% set rate = states('input_number.humidifier_evaporation_rate_ml_h') | float(500.0) %}
              {{ (([0, (capacity - consumed)] | max) / rate) | round(1) }}
            {% endif %}
          full_cycle_valid: "{{ is_state('input_boolean.humidifier_full_cycle_valid', 'on') }}"
          calibration_cycles: "{{ states('input_number.humidifier_calibration_cycles') | int(0) }}"
          last_calibration: "{{ states('input_text.humidifier_last_calibration') }}"

  - sensor:
      - name: "Humidifier Effective Intensity"
        unique_id: humidifier_effective_intensity
        unit_of_measurement: "%"
        icon: mdi:air-humidifier
        availability: >
          {{ not is_state('humidifier.humidifier_puh_9105_puh_2709_humidifier', 'unavailable')
             and not is_state('humidifier.humidifier_puh_9105_puh_2709_humidifier', 'unknown')
             and not is_state('binary_sensor.humidifier_puh_9105_puh_2709_available', 'off') }}
        state: >
          {% set hum_on = is_state('humidifier.humidifier_puh_9105_puh_2709_humidifier', 'on') %}
          {% set power_on = is_state('switch.humidifier_puh_9105_puh_2709_power', 'on') %}
          {% set tank_removed = is_state('binary_sensor.humidifier_puh_9105_puh_2709_water_tank', 'on') %}
          {% set err = states('sensor.humidifier_puh_9105_puh_2709_error') %}
          {% if (hum_on or power_on) and not tank_removed and err in ['00', 'no_error', '02', 'child_lock', ''] %}
            100
          {% else %}
            0
          {% endif %}

  # ════════════════════════════════════════════════════════════════════════════
  #  ZAP — БЛОК 1: РАСЧЁТ СКОРОСТИ ИЗМЕНЕНИЯ ВЛАЖНОСТИ
  # ════════════════════════════════════════════════════════════════════════════
  - trigger:
      - platform: time_pattern
        minutes: "/1"
      - platform: homeassistant
        event: start
    sensor:
      - name: "Humidity Zap Rate"
        unique_id: humidity_zap_rate
        unit_of_measurement: "%/min"
        state_class: measurement
        icon: mdi:trending-up
        state: >
          {% set attrs = this.attributes if (this is defined and this.attributes is defined) else {} %}
          {% set current = (states('sensor.humidity_zap_filtered') if has_value('sensor.humidity_zap_filtered') else states('sensor.sensor_zap_humidity')) | float(none) %}
          {% set prev_rate = (this.state if (this is defined and this.state is defined) else 0) | float(0) %}
          {% if current is none %}
            {{ prev_rate }}
          {% else %}
            {% set old = attrs.get('h5', current) | float(current) %}
            {% set rate = (current - old) / 5 %}
            {{ (0.4 * rate + 0.6 * prev_rate) | round(3) }}
          {% endif %}
        attributes:
          h1: "{{ (states('sensor.humidity_zap_filtered') if has_value('sensor.humidity_zap_filtered') else states('sensor.sensor_zap_humidity')) | float(0) }}"
          h2: "{{ (this.attributes.get('h1') if (this is defined and this.attributes is defined) else none) | default(states('sensor.humidity_zap_filtered') if has_value('sensor.humidity_zap_filtered') else states('sensor.sensor_zap_humidity'), true) | float(0) }}"
          h3: "{{ (this.attributes.get('h2') if (this is defined and this.attributes is defined) else none) | default(states('sensor.humidity_zap_filtered') if has_value('sensor.humidity_zap_filtered') else states('sensor.sensor_zap_humidity'), true) | float(0) }}"
          h4: "{{ (this.attributes.get('h3') if (this is defined and this.attributes is defined) else none) | default(states('sensor.humidity_zap_filtered') if has_value('sensor.humidity_zap_filtered') else states('sensor.sensor_zap_humidity'), true) | float(0) }}"
          h5: "{{ (this.attributes.get('h4') if (this is defined and this.attributes is defined) else none) | default(states('sensor.humidity_zap_filtered') if has_value('sensor.humidity_zap_filtered') else states('sensor.sensor_zap_humidity'), true) | float(0) }}"
          current_humidity: "{{ (states('sensor.humidity_zap_filtered') if has_value('sensor.humidity_zap_filtered') else states('sensor.sensor_zap_humidity')) | float(0) }}"
          raw_humidity: "{{ states('sensor.sensor_zap_humidity') | float(0) | round(2) }}"
          filtered_humidity: "{{ (states('sensor.humidity_zap_filtered') if has_value('sensor.humidity_zap_filtered') else states('sensor.sensor_zap_humidity')) | float(0) | round(2) }}"
          derivative_slope_5m: "{{ states('sensor.humidity_zap_slope') | float(0) | round(3) }}"
          filter_type: "ema_lowpass"
          minutes_window: 5

  # ════════════════════════════════════════════════════════════════════════════
  #  ZAP — БЛОК 2: ЦЕЛЬ И ОШИБКА РЕГУЛИРОВАНИЯ
  # ════════════════════════════════════════════════════════════════════════════
  - trigger:
      - platform: state
        entity_id:
          - sensor.humidity_zap_filtered
          - sensor.sensor_zap_temperature
          - input_boolean.humidity_zap_adaptive_target
          - input_number.humidity_zap_target
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/1"
    sensor:
      - name: "Humidity Zap Adaptive Target"
        unique_id: humidity_zap_adaptive_target
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:water-thermometer-outline
        availability: >
          {{ has_value('sensor.sensor_zap_temperature') }}
        state: >
          {% set T_room = states('sensor.sensor_zap_temperature') | float(22) %}
          {% set base_indoor = 75 - (1.25 * T_room) %}
          {% set target = [base_indoor, 60] | min | float %}
          {{ ([target, 35] | max) | round(1) }}

      - name: "Humidity Zap Target Humidity"
        unique_id: humidity_zap_effective_target
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:water-check
        availability: >
          {{ has_value('input_number.humidity_zap_target') or
             (is_state('input_boolean.humidity_zap_adaptive_target', 'on') and
              has_value('sensor.sensor_zap_temperature')) }}
        state: >
          {% set adaptive_on = is_state('input_boolean.humidity_zap_adaptive_target', 'on') %}
          {% set has_adaptive_inputs = has_value('sensor.sensor_zap_temperature') %}
          {% if adaptive_on and has_adaptive_inputs %}
            {% set T_room = states('sensor.sensor_zap_temperature') | float(22) %}
            {% set base_indoor = 75 - (1.25 * T_room) %}
            {% set target = [base_indoor, 60] | min | float %}
            {{ ([target, 35] | max) | round(1) }}
          {% else %}
            {{ states('input_number.humidity_zap_target') | float(35) | round(1) }}
          {% endif %}
        attributes:
          controller_version: "4.5.0"
          area_id: "zap"
          target_mode: >
            {% if is_state('input_boolean.humidity_zap_adaptive_target', 'on') %}
              {% if has_value('sensor.sensor_zap_temperature') %}
                adaptive
              {% else %}
                manual_fallback
              {% endif %}
            {% else %}
              manual
            {% endif %}
          manual_target: "{{ states('input_number.humidity_zap_target') | float(35) | round(1) }}"
          adaptive_target: >
            {% if has_value('sensor.sensor_zap_temperature') %}
              {% set T_room = states('sensor.sensor_zap_temperature') | float(22) %}
              {% set base_indoor = 75 - (1.25 * T_room) %}
              {% set target = [base_indoor, 60] | min | float %}
              {{ ([target, 35] | max) | round(1) }}
            {% else %}
              unknown
            {% endif %}

      - name: "Humidity Zap Error"
        unique_id: humidity_zap_error
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:delta
        availability: >
          {{ (has_value('sensor.humidity_zap_filtered') or has_value('sensor.sensor_zap_humidity')) and
             (has_value('input_number.humidity_zap_target') or
              (is_state('input_boolean.humidity_zap_adaptive_target', 'on') and
               has_value('sensor.sensor_zap_temperature'))) }}
        state: >
          {% set adaptive_on = is_state('input_boolean.humidity_zap_adaptive_target', 'on') %}
          {% set has_adaptive_inputs = has_value('sensor.sensor_zap_temperature') %}
          {% if adaptive_on and has_adaptive_inputs %}
            {% set T_room = states('sensor.sensor_zap_temperature') | float(22) %}
            {% set base_indoor = 75 - (1.25 * T_room) %}
            {% set target = [[base_indoor, 60] | min | float, 35] | max %}
          {% else %}
            {% set target = states('input_number.humidity_zap_target') | float(35) %}
          {% endif %}
          {% set current = (states('sensor.humidity_zap_filtered') if has_value('sensor.humidity_zap_filtered') else states('sensor.sensor_zap_humidity')) | float(50) %}
          {{ (target - current) | round(2) }}
        attributes:
          raw_humidity: "{{ states('sensor.sensor_zap_humidity') | float(0) | round(2) }}"
          filtered_humidity: "{{ (states('sensor.humidity_zap_filtered') if has_value('sensor.humidity_zap_filtered') else states('sensor.sensor_zap_humidity')) | float(0) | round(2) }}"
          target_humidity: "{{ states('sensor.humidity_zap_target_humidity') | float(35) | round(1) }}"
          error_source: "filtered_humidity_error"

  # ════════════════════════════════════════════════════════════════════════════
  #  ZAP — БЛОК 3: ПРЕДИКТИВНЫЙ ON/OFF-РЕГУЛЯТОР (0% / 100%) ПО AREA DEVICES
  # ════════════════════════════════════════════════════════════════════════════
  - trigger:
      - platform: state
        entity_id:
          - sensor.humidity_zap_error
          - sensor.humidity_zap_rate
          - humidifier.humidifier_puh_9105_puh_2709_humidifier_2
          - switch.humidifier_puh_9105_puh_2709_power_2
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/1"
    sensor:
      - name: "Humidity Zap Recommended Intensity"
        unique_id: humidity_zap_recommended_intensity
        unit_of_measurement: "%"
        icon: mdi:gauge
        availability: >
          {% set ns = namespace(has_hum=false) %}
          {% for dev in area_devices('zap') %}
            {% set ents = device_entities(dev) %}
            {% set hum = ents | select('match', '^humidifier\\.') | first | default('') %}
            {% if hum != '' and states(hum) not in ['unavailable', 'unknown'] %}
              {% set ns.has_hum = true %}
            {% endif %}
          {% endfor %}
          {{ has_value('sensor.humidity_zap_error') and
             has_value('sensor.humidity_zap_rate') and
             ns.has_hum }}
        state: >
          {% set error = states('sensor.humidity_zap_error') | float(0) %}
          {% set rate = states('sensor.humidity_zap_rate') | float(0) %}
          {% set ns_dev = namespace(has_on=false) %}
          {% for dev in area_devices('zap') %}
            {% set ents = device_entities(dev) %}
            {% set hum = ents | select('match', '^humidifier\\.') | first | default('') %}
            {% if hum != '' %}
              {% set pwr = ents | select('match', '^switch\\..*_power(_\\d+)?$') | first | default('') %}
              {% if is_state(hum, 'on') or (pwr != '' and is_state(pwr, 'on')) %}
                {% set ns_dev.has_on = true %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {% set prev_demand = ((this.state | int(0)) > 0) if (this is defined and this.state is defined and this.state not in ['unknown', 'unavailable']) else ns_dev.has_on %}
          {% set predicted_error = error - (rate * 5) %}
          {% if prev_demand %}
            {% if error <= -0.35 or (error <= 0.0 and predicted_error <= -0.35) %}
              0
            {% else %}
              100
            {% endif %}
          {% else %}
            {% if error >= 0.30 or (error >= 0.10 and predicted_error >= 0.50) %}
              100
            {% else %}
              0
            {% endif %}
          {% endif %}
        attributes:
          controller_version: "4.5.0"
          area_id: "zap"
          device_count: >
            {% set ns = namespace(cnt=0) %}
            {% for dev in area_devices('zap') %}
              {% if device_entities(dev) | select('match', '^humidifier\\.') | list | count > 0 %}
                {% set ns.cnt = ns.cnt + 1 %}
              {% endif %}
            {% endfor %}
            {{ ns.cnt }}
          active_devices: >
            {% set ns = namespace(cnt=0) %}
            {% for dev in area_devices('zap') %}
              {% set ents = device_entities(dev) %}
              {% set hum = ents | select('match', '^humidifier\\.') | first | default('') %}
              {% if hum != '' %}
                {% set pwr = ents | select('match', '^switch\\..*_power(_\\d+)?$') | first | default('') %}
                {% if is_state(hum, 'on') or (pwr != '' and is_state(pwr, 'on')) %}
                  {% set ns.cnt = ns.cnt + 1 %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.cnt }}
          raw_humidity: "{{ states('sensor.sensor_zap_humidity') | float(0) | round(2) }}"
          filtered_humidity: "{{ (states('sensor.humidity_zap_filtered') if has_value('sensor.humidity_zap_filtered') else states('sensor.sensor_zap_humidity')) | float(0) | round(2) }}"
          error: "{{ states('sensor.humidity_zap_error') | float(0) }}"
          rate: "{{ states('sensor.humidity_zap_rate') | float(0) }}"
          predicted_error: >
            {% set error = states('sensor.humidity_zap_error') | float(0) %}
            {% set rate = states('sensor.humidity_zap_rate') | float(0) %}
            {{ (error - (rate * 5)) | round(2) }}
          control_mode: >
            {% set error = states('sensor.humidity_zap_error') | float(0) %}
            {% set rate = states('sensor.humidity_zap_rate') | float(0) %}
            {% set predicted = error - (rate * 5) %}
            {% if predicted > 0.5 %}
              humidifying
            {% elif predicted < -0.5 %}
              drying
            {% else %}
              stable
            {% endif %}
          overshoot: >
            {% set error = states('sensor.humidity_zap_error') | float(0) %}
            {{ error < -0.5 }}
          overshoot_pct: >
            {% set error = states('sensor.humidity_zap_error') | float(0) %}
            {{ ([0, -error] | max) | round(2) }}

  # ════════════════════════════════════════════════════════════════════════════
  #  ZAP — БЛОК 4: ВИРТУАЛЬНЫЙ СЕНСОР УРОВНЯ ВОДЫ
  # ════════════════════════════════════════════════════════════════════════════
  - trigger:
      - platform: time_pattern
        minutes: "/1"
        id: "tick"
      - platform: state
        entity_id: input_boolean.humidifier_zap_needs_refill
        to: "off"
        id: "refill_confirmed"
      - platform: event
        event_type: humidity_refill_reset
        event_data:
          room: "zap"
        id: "refill_event"
      - platform: state
        entity_id: switch.humidifier_puh_9105_puh_2709_power_2
        id: "power_change"
      - platform: state
        entity_id: humidifier.humidifier_puh_9105_puh_2709_humidifier_2
        id: "humidifier_change"
      - platform: state
        entity_id: binary_sensor.humidifier_puh_9105_puh_2709_water_tank_2
        id: "tank_change"
    sensor:
      - name: "Humidifier Zap Water Consumed"
        unique_id: humidifier_zap_water_consumed_ml
        unit_of_measurement: "ml"
        state_class: total
        icon: mdi:water-minus
        state: >
          {% set current = (this.state if (this is defined and this.state is defined) else 0) | float(0) %}
          {% if trigger is not defined %}
            {{ current }}
          {% else %}
            {% set tank_removed = is_state('binary_sensor.humidifier_puh_9105_puh_2709_water_tank_2', 'on') %}
            {% set power_on = is_state('humidifier.humidifier_puh_9105_puh_2709_humidifier_2', 'on') or is_state('switch.humidifier_puh_9105_puh_2709_power_2', 'on') %}
            {% set error = states('sensor.humidifier_puh_9105_puh_2709_error_2') %}

            {% if trigger.id in ['refill_confirmed', 'refill_event'] %}
              {{ 0 }}
            {% elif trigger.id == 'tick'
                and power_on
                and not tank_removed
                and error in ['no_error', '00', '02', 'child_lock', ''] %}
              {% set rate_ml_h = states('input_number.humidifier_zap_evaporation_rate_ml_h') | float(530.0) %}
              {{ (current + (rate_ml_h / 60.0)) | round(1) }}
            {% else %}
              {{ current }}
            {% endif %}
          {% endif %}

      - name: "Humidifier Zap Water Level"
        unique_id: humidifier_zap_water_level_pct
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:water-percent
        state: >
          {% if is_state('input_boolean.humidifier_zap_needs_refill', 'on')
                or states('sensor.humidifier_puh_9105_puh_2709_error_2') in ['01', 'low_water'] %}
            {{ 0 }}
          {% else %}
            {% set capacity = states('input_number.humidifier_zap_tank_capacity_ml') | float(5000) %}
            {% set consumed = states('sensor.humidifier_zap_water_consumed') | float(0) %}
            {{ [0, (((capacity - consumed) / capacity) * 100)] | max | round(0) }}
          {% endif %}
        attributes:
          capacity_ml: "{{ states('input_number.humidifier_zap_tank_capacity_ml') | float(5000) | round(0) }}"
          consumed_ml: "{{ states('sensor.humidifier_zap_water_consumed') | float(0) | round(0) }}"
          remaining_ml: >
            {% if is_state('input_boolean.humidifier_zap_needs_refill', 'on')
                  or states('sensor.humidifier_puh_9105_puh_2709_error_2') in ['01', 'low_water'] %}
              {{ 0 }}
            {% else %}
              {% set capacity = states('input_number.humidifier_zap_tank_capacity_ml') | float(5000) %}
              {% set consumed = states('sensor.humidifier_zap_water_consumed') | float(0) %}
              {{ [0, (capacity - consumed)] | max | round(0) }}
            {% endif %}
          evaporation_rate_ml_h: "{{ states('input_number.humidifier_zap_evaporation_rate_ml_h') | float(530.0) | round(1) }}"
          active_hours: "{{ states('sensor.humidifier_zap_active_hours') | float(0) | round(2) }}"
          hours_remaining: >
            {% if is_state('input_boolean.humidifier_zap_needs_refill', 'on')
                  or states('sensor.humidifier_puh_9105_puh_2709_error_2') in ['01', 'low_water'] %}
              {{ 0.0 }}
            {% else %}
              {% set capacity = states('input_number.humidifier_zap_tank_capacity_ml') | float(5000) %}
              {% set consumed = states('sensor.humidifier_zap_water_consumed') | float(0) %}
              {% set rate = states('input_number.humidifier_zap_evaporation_rate_ml_h') | float(530.0) %}
              {{ (([0, (capacity - consumed)] | max) / rate) | round(1) }}
            {% endif %}
          full_cycle_valid: "{{ is_state('input_boolean.humidifier_zap_full_cycle_valid', 'on') }}"
          calibration_cycles: "{{ states('input_number.humidifier_zap_calibration_cycles') | int(0) }}"
          last_calibration: "{{ states('input_text.humidifier_zap_last_calibration') }}"

  - sensor:
      - name: "Humidifier Zap Effective Intensity"
        unique_id: humidifier_zap_effective_intensity
        unit_of_measurement: "%"
        icon: mdi:air-humidifier
        availability: >
          {{ not is_state('humidifier.humidifier_puh_9105_puh_2709_humidifier_2', 'unavailable')
             and not is_state('humidifier.humidifier_puh_9105_puh_2709_humidifier_2', 'unknown')
             and not is_state('binary_sensor.humidifier_puh_9105_puh_2709_available_2', 'off') }}
        state: >
          {% set hum_on = is_state('humidifier.humidifier_puh_9105_puh_2709_humidifier_2', 'on') %}
          {% set power_on = is_state('switch.humidifier_puh_9105_puh_2709_power_2', 'on') %}
          {% set tank_removed = is_state('binary_sensor.humidifier_puh_9105_puh_2709_water_tank_2', 'on') %}
          {% set err = states('sensor.humidifier_puh_9105_puh_2709_error_2') %}
          {% if (hum_on or power_on) and not tank_removed and err in ['00', 'no_error', '02', 'child_lock', ''] %}
            100
          {% else %}
            0
          {% endif %}

# ──────────────────────────────────────────────────────────────────────────────
#  SCRIPTS (возобновление и area-driven управление устройствами)
# ──────────────────────────────────────────────────────────────────────────────

script:
  humidity_auto_resume:
    alias: "Возобновить авто‑управление увлажнителем"
    mode: single
    sequence:
      - service: automation.turn_on
        target:
          entity_id:
            - automation.humidity_control_main
            - automation.humidity_mode_enforcer

  humidity_zap_auto_resume:
    alias: "Возобновить авто‑управление увлажнителем zap"
    mode: single
    sequence:
      - service: automation.turn_on
        target:
          entity_id:
            - automation.humidity_zap_control_main
            - automation.humidity_zap_mode_enforcer

  humidifier_confirm_refill:
    alias: "Подтвердить полную заправку бака увлажнителя (100%)"
    mode: parallel
    max: 4
    fields:
      room:
        description: "Комната (eva или zap)"
        required: true
    sequence:
      - variables:
          is_zap: "{{ room == 'zap' }}"
          refill_bool: "{{ 'input_boolean.humidifier_zap_needs_refill' if is_zap else 'input_boolean.humidifier_needs_refill' }}"
          warn_bool: "{{ 'input_boolean.humidifier_zap_low_water_warned' if is_zap else 'input_boolean.humidifier_low_water_warned' }}"
          valid_bool: "{{ 'input_boolean.humidifier_zap_full_cycle_valid' if is_zap else 'input_boolean.humidifier_full_cycle_valid' }}"
          cycle_dt: "{{ 'input_datetime.humidifier_zap_cycle_start' if is_zap else 'input_datetime.humidifier_cycle_start' }}"
          ctrl_auto: "{{ 'automation.humidity_zap_control_main' if is_zap else 'automation.humidity_control_main' }}"
      - service: input_datetime.set_datetime
        target:
          entity_id: "{{ cycle_dt }}"
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - service: input_boolean.turn_on
        target:
          entity_id: "{{ valid_bool }}"
      - service: input_boolean.turn_off
        target:
          entity_id: "{{ warn_bool }}"
      - event: humidity_refill_reset
        event_data:
          room: "{{ room }}"
      - if:
          - condition: template
            value_template: "{{ is_state(refill_bool, 'on') }}"
        then:
          - service: input_boolean.turn_off
            target:
              entity_id: "{{ refill_bool }}"
      - delay:
          seconds: 1
      - service: automation.trigger
        target:
          entity_id: "{{ ctrl_auto }}"
        data:
          skip_condition: false
      - action: script.notify_clear
        data:
          tag: "humidifier_water_{{ room }}"
          clear_mobile: true
      - action: script.notify_dispatch
        data:
          level: p3_info
          tag: "humidifier_water_{{ room }}"
          title: "✅ Бак заправлен ({{ room }})"
          message: "Счётчик воды сброшен на 100%, автоуправление активно."

  humidifier_eva_confirm_refill:
    alias: "Бак заправлен 100% (eva)"
    icon: mdi:water-sync
    mode: single
    sequence:
      - service: script.humidifier_confirm_refill
        data:
          room: "eva"

  humidifier_zap_confirm_refill:
    alias: "Бак заправлен 100% (zap)"
    icon: mdi:water-sync
    mode: single
    sequence:
      - service: script.humidifier_confirm_refill
        data:
          room: "zap"

  humidity_setup_area_devices:
    alias: "Инициализация увлажнителей комнаты по area"
    mode: parallel
    max: 10
    fields:
      area_name:
        description: "Area ID комнаты (eva или zap)"
        required: true
      recommended_entity:
        description: "Entity ID сенсора рекомендуемой интенсивности"
        required: true
    sequence:
      - repeat:
          for_each: >-
            {%- set ns = namespace(devs=[]) -%}
            {%- for dev in area_devices(area_name) -%}
              {%- if device_entities(dev) | select('match', '^humidifier\\.') | list | count > 0 -%}
                {%- set ns.devs = ns.devs + [dev] -%}
              {%- endif -%}
            {%- endfor -%}
            {{- ns.devs -}}
          sequence:
            - variables:
                hum_ent: "{{ device_entities(repeat.item) | select('match', '^humidifier\\.') | first | default('') }}"
                power_ent: "{{ device_entities(repeat.item) | select('match', '^switch\\..*_power(_\\d+)?$') | first | default('') }}"
            - if:
                - condition: template
                  value_template: "{{ power_ent != '' and hum_ent != '' }}"
              then:
                - wait_template: "{{ has_value(hum_ent) and states(power_ent) != 'unavailable' and has_value(recommended_entity) }}"
                  timeout: "00:00:30"
                  continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ has_value(recommended_entity) }}"
        then:
          - service: script.humidity_apply_area_control
            data:
              area_name: "{{ area_name }}"
              recommended_entity: "{{ recommended_entity }}"

  humidity_enforce_area_mode:
    alias: "Контроль ночного режима (sleep) увлажнителей комнаты по area"
    mode: parallel
    max: 10
    fields:
      area_name:
        description: "Area ID комнаты (eva или zap)"
        required: true
      recommended_entity:
        description: "Entity ID сенсора рекомендуемой интенсивности"
        required: true
      trigger_kind:
        description: "Идентификатор триггера"
        required: false
    sequence:
      - if:
          - condition: template
            value_template: "{{ has_value(recommended_entity) and (states(recommended_entity) | int(0)) >= 1 }}"
        then:
          - service: script.humidity_apply_area_control
            data:
              area_name: "{{ area_name }}"
              recommended_entity: "{{ recommended_entity }}"

  humidity_apply_area_control:
    alias: "Применить интенсивность ко всем увлажнителям комнаты по area"
    mode: parallel
    max: 10
    fields:
      area_name:
        description: "Area ID комнаты (eva или zap)"
        required: true
      recommended_entity:
        description: "Entity ID сенсора рекомендуемой интенсивности"
        required: true
    sequence:
      - repeat:
          for_each: >-
            {%- set ns = namespace(devs=[]) -%}
            {%- for dev in area_devices(area_name) -%}
              {%- if device_entities(dev) | select('match', '^humidifier\\.') | list | count > 0 -%}
                {%- set ns.devs = ns.devs + [dev] -%}
              {%- endif -%}
            {%- endfor -%}
            {{- ns.devs -}}
          sequence:
            - variables:
                hum_ent: "{{ device_entities(repeat.item) | select('match', '^humidifier\\.') | first | default('') }}"
                power_ent: "{{ device_entities(repeat.item) | select('match', '^switch\\..*_power(_\\d+)?$') | first | default('') }}"
                err_ent: "{{ device_entities(repeat.item) | select('match', '^sensor\\..*_error(_\\d+)?$') | first | default('') }}"
                tank_ent: "{{ device_entities(repeat.item) | select('match', '^binary_sensor\\..*_water_tank(_\\d+)?$') | first | default('') }}"
                sound_ent: "{{ device_entities(repeat.item) | select('match', '^switch\\..*_sound(_\\d+)?$') | first | default('') }}"
                backlight_ent: "{{ device_entities(repeat.item) | select('match', '^switch\\..*_backlight(_\\d+)?$') | first | default('') }}"
                child_lock_ent: "{{ device_entities(repeat.item) | select('match', '^switch\\..*_child_lock(_\\d+)?$') | first | default('') }}"
                ioniser_ent: "{{ device_entities(repeat.item) | select('match', '^switch\\..*_ioniser(_\\d+)?$') | first | default('') }}"
                warm_stream_ent: "{{ device_entities(repeat.item) | select('match', '^switch\\..*_warm_stream(_\\d+)?$') | first | default('') }}"
                refill_ent: >-
                  {% set refill_map = {
                    'f43455f7aee7b027ac2eb35423ae52a0': 'input_boolean.humidifier_needs_refill',
                    '5a852dda51c440695fa49cd839760ae6': 'input_boolean.humidifier_zap_needs_refill'
                  } %}
                  {{ refill_map.get(repeat.item, '') }}
                recommended: "{{ states(recommended_entity) | int(0) }}"
                dev_is_on: >-
                  {{ hum_ent != '' and (
                       is_state(hum_ent, 'on')
                       or (power_ent != '' and is_state(power_ent, 'on'))
                     ) }}
                standby_settled: >-
                  {% set lc = states[hum_ent].last_changed if (hum_ent != '' and states[hum_ent] is not none) else none %}
                  {% set age = (as_timestamp(now()) - as_timestamp(lc)) if lc is not none else 999 %}
                  {{ age >= 6 }}
                has_fault_or_empty: >-
                  {{ (err_ent != '' and states(err_ent) not in ['00', 'no_error', '02', 'child_lock', '', 'unknown', 'unavailable'])
                     or (refill_ent != '' and is_state(refill_ent, 'on'))
                     or (tank_ent != '' and is_state(tank_ent, 'on')) }}
                can_run: >-
                  {{ (err_ent == '' or states(err_ent) in ['00', 'no_error', '02', 'child_lock', '', 'unknown', 'unavailable'])
                     and (refill_ent == '' or not is_state(refill_ent, 'on'))
                     and (tank_ent == '' or not is_state(tank_ent, 'on')) }}
                refill_auto: >-
                  {{ 'automation.humidity_zap_refill_detected' if refill_ent == 'input_boolean.humidifier_zap_needs_refill'
                     else ('automation.humidity_refill_detected' if refill_ent == 'input_boolean.humidifier_needs_refill' else '') }}
                refill_probe_grace: >-
                  {% set probe_running = refill_auto != '' and (state_attr(refill_auto, 'current') | int(0)) > 0 %}
                  {% set lc = states[hum_ent].last_changed if (hum_ent != '' and states[hum_ent] is not none) else none %}
                  {% set age = (as_timestamp(now()) - as_timestamp(lc)) if lc is not none else 999 %}
                  {{ probe_running or (
                       refill_ent != '' and is_state(refill_ent, 'on')
                       and is_state(hum_ent, 'on')
                       and (err_ent == '' or states(err_ent) in ['00', 'no_error', '02', 'child_lock', ''])
                       and age < 70
                     ) }}

            - if:
                - condition: template
                  value_template: >
                    {{ hum_ent != '' and power_ent != ''
                       and states(hum_ent) != 'unavailable'
                       and states(power_ent) != 'unavailable' }}
              then:
                - choose:
                    # ── ВЕТКА ВЫКЛЮЧЕНИЯ (recommended == 0 или устройство не готово к работе) ──
                    - conditions:
                        - condition: template
                          value_template: "{{ (recommended | int(0)) == 0 or not (can_run | bool(false)) }}"
                      sequence:
                        - if:
                            - condition: template
                              value_template: "{{ (dev_is_on | bool(false)) and not (refill_probe_grace | bool(false)) }}"
                          then:
                            - if:
                                - condition: template
                                  value_template: "{{ child_lock_ent != '' and is_state(child_lock_ent, 'off') and not (has_fault_or_empty | bool(false)) }}"
                              then:
                                - service: switch.turn_on
                                  continue_on_error: true
                                  target:
                                    entity_id: "{{ child_lock_ent }}"
                            - variables:
                                aux_off: >-
                                  {% set ns = namespace(items=[]) %}
                                  {% if not (has_fault_or_empty | bool(false)) %}
                                    {% if warm_stream_ent != '' and is_state(warm_stream_ent, 'on') %}{% set ns.items = ns.items + [warm_stream_ent] %}{% endif %}
                                    {% if ioniser_ent != '' and is_state(ioniser_ent, 'on') %}{% set ns.items = ns.items + [ioniser_ent] %}{% endif %}
                                    {% if backlight_ent != '' and is_state(backlight_ent, 'on') %}{% set ns.items = ns.items + [backlight_ent] %}{% endif %}
                                    {% if sound_ent != '' and is_state(sound_ent, 'on') %}{% set ns.items = ns.items + [sound_ent] %}{% endif %}
                                  {% endif %}
                                  {{ ns.items }}
                            - if:
                                - condition: template
                                  value_template: "{{ (aux_off | count) > 0 }}"
                              then:
                                - service: switch.turn_off
                                  target:
                                    entity_id: "{{ aux_off }}"
                            - service: switch.turn_off
                              target:
                                entity_id: "{{ power_ent }}"
                            - wait_template: "{{ is_state(hum_ent, 'off') }}"
                              timeout: "00:00:05"
                              continue_on_timeout: true
                            - if:
                                - condition: template
                                  value_template: "{{ not wait.completed and not is_state(hum_ent, 'off') }}"
                              then:
                                - service: switch.turn_off
                                  target:
                                    entity_id: "{{ power_ent }}"

                    # ── ВЕТКА ХОЛОДНОГО СТАРТА (recommended >= 1 и устройство сейчас выключено) ──
                    - conditions:
                        - condition: template
                          value_template: "{{ (recommended | int(0)) >= 1 and (can_run | bool(false)) and not (dev_is_on | bool(false)) and (standby_settled | bool(false)) and (refill_auto == '' or (state_attr(refill_auto, 'current') | int(0)) == 0) }}"
                      sequence:
                        - delay:
                            seconds: 3
                        - condition: template
                          value_template: >-
                            {{ (states(recommended_entity) | int(0)) >= 1
                               and states(hum_ent) not in ['unavailable', 'unknown']
                               and states(power_ent) not in ['unavailable', 'unknown']
                               and (err_ent == '' or states(err_ent) in ['00', 'no_error', '02', 'child_lock', '', 'unknown', 'unavailable'])
                               and (refill_ent == '' or not is_state(refill_ent, 'on'))
                               and (tank_ent == '' or not is_state(tank_ent, 'on'))
                               and (refill_auto == '' or (state_attr(refill_auto, 'current') | int(0)) == 0)
                               and not is_state(hum_ent, 'on')
                               and not is_state(power_ent, 'on') }}
                        - service: switch.turn_on
                          target:
                            entity_id: "{{ power_ent }}"
                        - delay:
                            seconds: 1
                        - service: humidifier.set_mode
                          target:
                            entity_id: "{{ hum_ent }}"
                          data:
                            mode: "sleep"
                        - delay:
                            seconds: 2
                        - if:
                            - condition: template
                              value_template: >-
                                {{ is_state(hum_ent, 'on')
                                   and (err_ent == '' or states(err_ent) in ['00', 'no_error', '02', 'child_lock', '', 'unknown', 'unavailable'])
                                   and (refill_ent == '' or not is_state(refill_ent, 'on'))
                                   and (tank_ent == '' or not is_state(tank_ent, 'on')) }}
                          then:
                            - variables:
                                early_off: >-
                                  {% set ns = namespace(items=[]) %}
                                  {% if sound_ent != '' and not is_state(sound_ent, 'off') %}{% set ns.items = ns.items + [sound_ent] %}{% endif %}
                                  {% if backlight_ent != '' and not is_state(backlight_ent, 'off') %}{% set ns.items = ns.items + [backlight_ent] %}{% endif %}
                                  {{ ns.items }}
                            - if:
                                - condition: template
                                  value_template: "{{ (early_off | count) > 0 }}"
                              then:
                                - service: switch.turn_off
                                  continue_on_error: true
                                  target:
                                    entity_id: "{{ early_off }}"
                            - if:
                                - condition: template
                                  value_template: "{{ child_lock_ent != '' and not is_state(child_lock_ent, 'on') }}"
                              then:
                                - service: switch.turn_on
                                  continue_on_error: true
                                  target:
                                    entity_id: "{{ child_lock_ent }}"
                        - delay:
                            seconds: 2
                        - variables:
                            rec_after_boot: "{{ states(recommended_entity) | int(0) }}"
                        - if:
                            - condition: template
                              value_template: "{{ (rec_after_boot | int(0)) == 0 }}"
                          then:
                            - if:
                                - condition: template
                                  value_template: "{{ is_state(hum_ent, 'on') or is_state(power_ent, 'on') }}"
                              then:
                                - service: switch.turn_off
                                  target:
                                    entity_id: "{{ power_ent }}"
                                - wait_template: "{{ is_state(hum_ent, 'off') }}"
                                  timeout: "00:00:05"
                                  continue_on_timeout: true
                          else:
                            - if:
                                - condition: template
                                  value_template: >-
                                    {{ is_state(hum_ent, 'on')
                                       and (err_ent == '' or states(err_ent) in ['00', 'no_error', '02', 'child_lock', '', 'unknown', 'unavailable'])
                                       and (refill_ent == '' or not is_state(refill_ent, 'on'))
                                       and (tank_ent == '' or not is_state(tank_ent, 'on')) }}
                              then:
                                - variables:
                                    boot_off_switches: >-
                                      {% set ns = namespace(items=[]) %}
                                      {% if sound_ent != '' and not is_state(sound_ent, 'off') %}{% set ns.items = ns.items + [sound_ent] %}{% endif %}
                                      {% if backlight_ent != '' and not is_state(backlight_ent, 'off') %}{% set ns.items = ns.items + [backlight_ent] %}{% endif %}
                                      {{ ns.items }}
                                    boot_on_switches: >-
                                      {% set ns = namespace(items=[]) %}
                                      {% if child_lock_ent != '' and not is_state(child_lock_ent, 'on') %}{% set ns.items = ns.items + [child_lock_ent] %}{% endif %}
                                      {% if ioniser_ent != '' and not is_state(ioniser_ent, 'on') %}{% set ns.items = ns.items + [ioniser_ent] %}{% endif %}
                                      {% if warm_stream_ent != '' and not is_state(warm_stream_ent, 'on') %}{% set ns.items = ns.items + [warm_stream_ent] %}{% endif %}
                                      {{ ns.items }}
                                - if:
                                    - condition: template
                                      value_template: "{{ (boot_off_switches | count) > 0 }}"
                                  then:
                                    - service: switch.turn_off
                                      target:
                                        entity_id: "{{ boot_off_switches }}"
                                - if:
                                    - condition: template
                                      value_template: "{{ (boot_on_switches | count) > 0 }}"
                                  then:
                                    - service: switch.turn_on
                                      target:
                                        entity_id: "{{ boot_on_switches }}"
                                - if:
                                    - condition: template
                                      value_template: "{{ state_attr(hum_ent, 'mode') != 'sleep' }}"
                                  then:
                                    - service: humidifier.set_mode
                                      target:
                                        entity_id: "{{ hum_ent }}"
                                      data:
                                        mode: "sleep"

                    # ── ВЕТКА РАБОТЫ (recommended >= 1 и устройство уже включено) ──
                    - conditions:
                        - condition: template
                          value_template: "{{ (recommended | int(0)) >= 1 and (can_run | bool(false)) and (dev_is_on | bool(false)) }}"
                      sequence:
                        - if:
                            - condition: template
                              value_template: "{{ state_attr(hum_ent, 'mode') != 'sleep' }}"
                          then:
                            - service: humidifier.set_mode
                              target:
                                entity_id: "{{ hum_ent }}"
                              data:
                                mode: "sleep"
                            - delay:
                                seconds: 1
                        - variables:
                            switches_to_off: >-
                              {% set ns = namespace(items=[]) %}
                              {% if sound_ent != '' and is_state(sound_ent, 'on') %}{% set ns.items = ns.items + [sound_ent] %}{% endif %}
                              {% if backlight_ent != '' and is_state(backlight_ent, 'on') %}{% set ns.items = ns.items + [backlight_ent] %}{% endif %}
                              {{ ns.items }}
                            switches_to_on: >-
                              {% set ns = namespace(items=[]) %}
                              {% if child_lock_ent != '' and is_state(child_lock_ent, 'off') %}{% set ns.items = ns.items + [child_lock_ent] %}{% endif %}
                              {% if ioniser_ent != '' and is_state(ioniser_ent, 'off') %}{% set ns.items = ns.items + [ioniser_ent] %}{% endif %}
                              {% if warm_stream_ent != '' and is_state(warm_stream_ent, 'off') %}{% set ns.items = ns.items + [warm_stream_ent] %}{% endif %}
                              {{ ns.items }}
                        - if:
                            - condition: template
                              value_template: "{{ (switches_to_off | count) > 0 }}"
                          then:
                            - service: switch.turn_off
                              target:
                                entity_id: "{{ switches_to_off }}"
                        - if:
                            - condition: template
                              value_template: "{{ (switches_to_on | count) > 0 }}"
                          then:
                            - service: switch.turn_on
                              target:
                                entity_id: "{{ switches_to_on }}"

# ──────────────────────────────────────────────────────────────────────────────
#  AUTOMATIONS
# ──────────────────────────────────────────────────────────────────────────────

automation:
  # ══════════════════════════════════════════════════════════════════════════
  #  АВТОПЕРЕКЛЮЧЕНИЕ НА РУЧНУЮ ЦЕЛЬ ПРИ ВВОДЕ С ДАШБОРДА
  # ══════════════════════════════════════════════════════════════════════════
  - id: "Переключение на ручную цель влажности при вводе"
    alias: humidity_manual_target_autoswitch
    description: "Автоматически выключает адаптивный режим при ручном изменении целевой влажности"
    mode: parallel
    max_exceeded: silent
    initial_state: true

    trigger:
      - platform: state
        entity_id: input_number.humidity_target
        id: "eva"
      - platform: state
        entity_id: input_number.humidity_zap_target
        id: "zap"

    condition:
      - condition: template
        value_template: >
          {{ trigger.from_state is not none
             and trigger.to_state is not none
             and trigger.from_state.state not in ['unknown', 'unavailable']
             and trigger.to_state.state not in ['unknown', 'unavailable']
             and (trigger.from_state.state | float != trigger.to_state.state | float) }}

    action:
      - variables:
          adaptive_entity: >
            {{ 'input_boolean.humidity_adaptive_target' if trigger.id == 'eva' else 'input_boolean.humidity_zap_adaptive_target' }}

      - if:
          - condition: template
            value_template: "{{ is_state(adaptive_entity, 'on') }}"
        then:
          - service: input_boolean.turn_off
            target:
              entity_id: "{{ adaptive_entity }}"

  # ══════════════════════════════════════════════════════════════════════════
  #  EVA — ИНИЦИАЛИЗАЦИЯ УСТРОЙСТВ (area: eva)
  # ══════════════════════════════════════════════════════════════════════════
  - id: humidity_device_setup
    alias: humidity_device_setup
    mode: single
    max_exceeded: silent
    initial_state: true

    trigger:
      - platform: state
        entity_id: automation.humidity_control_main
        to: "on"
      - platform: homeassistant
        event: start

    condition:
      - condition: state
        entity_id: automation.humidity_control_main
        state: "on"

    action:
      - service: script.humidity_setup_area_devices
        data:
          area_name: "eva"
          recommended_entity: "sensor.recommended_intensity"

  # ══════════════════════════════════════════════════════════════════════════
  #  EVA — КОНТРОЛЬ РЕЖИМА И БЛОКИРОВКИ (area: eva)
  # ══════════════════════════════════════════════════════════════════════════
  - id: humidity_mode_enforcer
    alias: humidity_mode_enforcer
    description: "Гарантирует HA-only управление, погашенный дисплей/звук, child_lock и режим 'sleep' (eva)"
    mode: single
    max_exceeded: silent
    initial_state: true

    trigger:
      - platform: state
        entity_id: humidifier.humidifier_puh_9105_puh_2709_humidifier
        attribute: mode
        for:
          seconds: 15
        id: "mode_changed"
      - platform: state
        entity_id: switch.humidifier_puh_9105_puh_2709_warm_stream
        to: "off"
        for:
          seconds: 15
        id: "warm_stream_off"
      - platform: state
        entity_id: switch.humidifier_puh_9105_puh_2709_ioniser
        to: "off"
        for:
          seconds: 15
        id: "ioniser_off"
      - platform: state
        entity_id: switch.humidifier_puh_9105_puh_2709_child_lock
        to: "off"
        for:
          seconds: 10
        id: "child_lock_off"
      - platform: state
        entity_id: switch.humidifier_puh_9105_puh_2709_backlight
        to: "on"
        for:
          seconds: 10
        id: "backlight_on"
      - platform: state
        entity_id: switch.humidifier_puh_9105_puh_2709_sound
        to: "on"
        for:
          seconds: 10
        id: "sound_on"
      - platform: state
        entity_id: humidifier.humidifier_puh_9105_puh_2709_humidifier
        to: "on"
        for:
          seconds: 12
        id: "unexpected_power_on"
      - platform: state
        entity_id: humidifier.humidifier_puh_9105_puh_2709_humidifier
        to: "off"
        for:
          seconds: 15
        id: "unexpected_power_off"

    condition:
      - condition: state
        entity_id: automation.humidity_control_main
        state: "on"
      - condition: template
        value_template: "{{ (state_attr('automation.humidity_refill_detected', 'current') | int(0)) == 0 }}"
      - condition: template
        value_template: >
          {% set rec = states('sensor.recommended_intensity') | int(0) %}
          {% set nr_on = is_state('input_boolean.humidifier_needs_refill', 'on') %}
          {% set ns = namespace(needed=false) %}
          {% for dev in area_devices('eva') %}
            {% set ents = device_entities(dev) %}
            {% set hum = ents | select('match', '^humidifier\\.') | first | default('') %}
            {% set err = ents | select('match', '^sensor\\..*_error(_\\d+)?$') | first | default('') %}
            {% set tank = ents | select('match', '^binary_sensor\\..*_water_tank(_\\d+)?$') | first | default('') %}
            {% set snd = ents | select('match', '^switch\\..*_sound(_\\d+)?$') | first | default('') %}
            {% set bl = ents | select('match', '^switch\\..*_backlight(_\\d+)?$') | first | default('') %}
            {% set cl = ents | select('match', '^switch\\..*_child_lock(_\\d+)?$') | first | default('') %}
            {% set ion = ents | select('match', '^switch\\..*_ioniser(_\\d+)?$') | first | default('') %}
            {% set ws = ents | select('match', '^switch\\..*_warm_stream(_\\d+)?$') | first | default('') %}
            {% if hum != '' and states(hum) != 'unavailable' %}
              {% set dev_can_run = (err == '' or states(err) in ['00', 'no_error', '02', 'child_lock', '', 'unknown', 'unavailable'])
                                   and not nr_on
                                   and (tank == '' or not is_state(tank, 'on')) %}
              {% set lc = states[hum].last_changed if states[hum] is not none else none %}
              {% set age = (as_timestamp(now()) - as_timestamp(lc)) if lc is not none else 999 %}
              {% if is_state(hum, 'on') %}
                {% if rec == 0 or not dev_can_run %}
                  {% if not (nr_on and age < 70) %}
                    {% set ns.needed = true %}
                  {% endif %}
                {% elif state_attr(hum, 'mode') != 'sleep'
                      or (ws != '' and is_state(ws, 'off'))
                      or (ion != '' and is_state(ion, 'off'))
                      or (cl != '' and is_state(cl, 'off'))
                      or (snd != '' and is_state(snd, 'on'))
                      or (bl != '' and is_state(bl, 'on')) %}
                  {% set ns.needed = true %}
                {% endif %}
              {% else %}
                {% if rec >= 1 and dev_can_run %}
                  {% set ns.needed = true %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.needed }}

    action:
      - service: automation.trigger
        target:
          entity_id: automation.humidity_control_main
        data:
          skip_condition: false

  # ══════════════════════════════════════════════════════════════════════════
  #  EVA — ОСНОВНОЕ УПРАВЛЕНИЕ (area: eva)
  # ══════════════════════════════════════════════════════════════════════════
  - id: humidity_control_main
    alias: humidity_control_main
    mode: queued
    max: 2
    max_exceeded: silent
    initial_state: true

    trigger:
      - platform: state
        entity_id: sensor.recommended_intensity
        to:
          - "0"
          - "100"
      - platform: state
        entity_id: input_boolean.humidifier_needs_refill
        to: "off"
      - platform: time_pattern
        minutes: "/2"

    condition:
      - condition: template
        value_template: "{{ has_value('sensor.recommended_intensity') }}"

    action:
      - service: script.humidity_apply_area_control
        data:
          area_name: "eva"
          recommended_entity: "sensor.recommended_intensity"

  # ══════════════════════════════════════════════════════════════════════════
  #  РАННЕЕ ПРЕДУПРЕЖДЕНИЕ О НИЗКОМ УРОВНЕ ВОДЫ (<= 15%, 1 раз за цикл)
  # ══════════════════════════════════════════════════════════════════════════
  - id: "Предупреждение о низком уровне воды в баке"
    alias: humidity_water_low_warning
    description: "Уведомляет один раз за цикл, когда расчётный уровень воды <= 15%"
    mode: parallel
    max: 4
    initial_state: true

    trigger:
      - platform: numeric_state
        entity_id: sensor.humidifier_water_level
        below: 16
        for:
          minutes: 1
        id: "eva"
      - platform: numeric_state
        entity_id: sensor.humidifier_zap_water_level
        below: 16
        for:
          minutes: 1
        id: "zap"

    condition:
      - condition: template
        value_template: >-
          {% set is_zap = trigger.id == 'zap' %}
          {% set refill_bool = 'input_boolean.humidifier_zap_needs_refill' if is_zap else 'input_boolean.humidifier_needs_refill' %}
          {% set warn_bool = 'input_boolean.humidifier_zap_low_water_warned' if is_zap else 'input_boolean.humidifier_low_water_warned' %}
          {% set err_ent = 'sensor.humidifier_puh_9105_puh_2709_error_2' if is_zap else 'sensor.humidifier_puh_9105_puh_2709_error' %}
          {{ is_state(refill_bool, 'off')
             and is_state(warn_bool, 'off')
             and states(err_ent) not in ['01', 'low_water'] }}

    action:
      - variables:
          is_zap: "{{ trigger.id == 'zap' }}"
          warn_bool: "{{ 'input_boolean.humidifier_zap_low_water_warned' if is_zap else 'input_boolean.humidifier_low_water_warned' }}"
          level_ent: "{{ 'sensor.humidifier_zap_water_level' if is_zap else 'sensor.humidifier_water_level' }}"
          level: "{{ states(level_ent) | int(0) }}"
          remaining_ml: "{{ state_attr(level_ent, 'remaining_ml') | int(0) }}"
          hours_raw: "{{ state_attr(level_ent, 'hours_remaining') | string }}"
          hours_rem: "{{ hours_raw if hours_raw not in ['unknown', 'unavailable', 'none', ''] else '?' }}"
      - service: input_boolean.turn_on
        target:
          entity_id: "{{ warn_bool }}"
      - action: script.notify_dispatch
        data:
          level: p3_info
          tag: "humidifier_water_{{ trigger.id }}"
          title: "⚠️ Мало воды в баке ({{ trigger.id }}) — {{ level }}%"
          message: "Осталось около {{ remaining_ml }} мл (~{{ hours_rem }} ч). Наполните бак водой — сброс и возобновление работы произойдут автоматически."
          inline_keyboard:
            - "✅ Бак заправлен:/refill_{{ trigger.id }}"

  # ══════════════════════════════════════════════════════════════════════════
  #  СИНХРОНИЗАЦИЯ РУЧНОГО СБРОСА needs_refill ЧЕРЕЗ UI-ТУМБЛЕР
  # ══════════════════════════════════════════════════════════════════════════
  - id: "Синхронизация ручного сброса заправки"
    alias: humidity_manual_refill_toggle
    description: "Обновляет cycle_start, full_cycle_valid и low_water_warned при ручном выключении needs_refill"
    mode: parallel
    max: 4
    initial_state: true

    trigger:
      - platform: state
        entity_id: input_boolean.humidifier_needs_refill
        from: "on"
        to: "off"
        id: "eva"
      - platform: state
        entity_id: input_boolean.humidifier_zap_needs_refill
        from: "on"
        to: "off"
        id: "zap"

    condition:
      - condition: template
        value_template: >-
          {% set cycle_dt = 'input_datetime.humidifier_zap_cycle_start' if trigger.id == 'zap' else 'input_datetime.humidifier_cycle_start' %}
          {{ (as_timestamp(now()) - as_timestamp(states(cycle_dt) | as_datetime | default(as_datetime(0), true))) > 5 }}

    action:
      - variables:
          is_zap: "{{ trigger.id == 'zap' }}"
          warn_bool: "{{ 'input_boolean.humidifier_zap_low_water_warned' if is_zap else 'input_boolean.humidifier_low_water_warned' }}"
          valid_bool: "{{ 'input_boolean.humidifier_zap_full_cycle_valid' if is_zap else 'input_boolean.humidifier_full_cycle_valid' }}"
          cycle_dt: "{{ 'input_datetime.humidifier_zap_cycle_start' if is_zap else 'input_datetime.humidifier_cycle_start' }}"
      - service: input_datetime.set_datetime
        target:
          entity_id: "{{ cycle_dt }}"
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - service: input_boolean.turn_on
        target:
          entity_id: "{{ valid_bool }}"
      - service: input_boolean.turn_off
        target:
          entity_id: "{{ warn_bool }}"
      - service: automation.trigger
        target:
          entity_id: "{{ 'automation.humidity_zap_control_main' if is_zap else 'automation.humidity_control_main' }}"
        data:
          skip_condition: false
      - action: script.notify_clear
        data:
          tag: "humidifier_water_{{ trigger.id }}"
          clear_mobile: true
      - action: script.notify_dispatch
        data:
          level: p3_info
          tag: "humidifier_water_{{ trigger.id }}"
          title: "✅ Бак заправлен ({{ trigger.id }})"
          message: "Флаг заправки снят вручную, счётчик воды сброшен на 100%."

  # ══════════════════════════════════════════════════════════════════════════
  #  EVA — КАЛИБРОВКА РАСХОДА (при опустошении бака)
  # ══════════════════════════════════════════════════════════════════════════
  - id: humidifier_calibrate_rates
    alias: humidifier_calibrate_rates
    description: "Автокалибровка фактического расхода в sleep-режиме (eva, active_hours, bounded full-cycle)"
    mode: restart
    initial_state: true

    trigger:
      - platform: state
        entity_id: sensor.humidifier_puh_9105_puh_2709_error
        to:
          - "low_water"
          - "01"

    condition:
      - condition: template
        value_template: "{{ trigger.from_state is not none and trigger.from_state.state in ['00', 'no_error', '02', 'child_lock'] }}"
      - condition: state
        entity_id: input_boolean.humidifier_full_cycle_valid
        state: "on"
      - condition: numeric_state
        entity_id: sensor.humidifier_water_consumed
        above: 2500
        below: 7500

    action:
      - variables:
          capacity: "{{ states('input_number.humidifier_tank_capacity_ml') | float(5000) }}"
          model_consumed: "{{ states('sensor.humidifier_water_consumed') | float(0) }}"
          active_hrs: "{{ states('sensor.humidifier_active_hours') | float(0) }}"
          old_rate: "{{ states('input_number.humidifier_evaporation_rate_ml_h') | float(500.0) }}"
          cycles: "{{ states('input_number.humidifier_calibration_cycles') | int(0) }}"
          capped_cycles: "{{ [cycles, 5] | min }}"
          measured_rate: >-
            {% set cap = capacity | float(5000) %}
            {% set hrs = active_hrs | float(0) %}
            {% set mod = model_consumed | float(0) %}
            {% set old_r = old_rate | float(500.0) %}
            {% if hrs >= 4.0 %}
              {{ (cap / hrs) | round(1) }}
            {% elif mod > 0 %}
              {{ (old_r * (cap / mod)) | round(1) }}
            {% else %}
              {{ old_r | round(1) }}
            {% endif %}
          new_rate: >-
            {% set old_r = old_rate | float(500.0) %}
            {% set meas = measured_rate | float(old_r) %}
            {% set cc = capped_cycles | int(0) %}
            {% set clamped = [[meas, old_r * 0.75] | max, old_r * 1.35] | min %}
            {% set blended = (old_r * cc + clamped) / (cc + 1) %}
            {{ [[blended, 300.0] | max, 620.0] | min | round(1) }}

      - delay: "00:03:00"

      - condition: state
        entity_id: input_boolean.humidifier_needs_refill
        state: "on"
      - condition: template
        value_template: "{{ (state_attr('automation.humidity_refill_detected', 'current') | int(0)) == 0 }}"
      - condition: template
        value_template: >-
          {% set t = states.binary_sensor.humidifier_puh_9105_puh_2709_water_tank %}
          {{ is_state('binary_sensor.humidifier_puh_9105_puh_2709_water_tank', 'off')
             or (t is not none and (as_timestamp(now()) - as_timestamp(t.last_changed)) >= 150) }}

      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.humidifier_full_cycle_valid

      - service: input_number.set_value
        target:
          entity_id: input_number.humidifier_evaporation_rate_ml_h
        data:
          value: "{{ new_rate }}"

      - service: input_number.set_value
        target:
          entity_id: input_number.humidifier_calibration_cycles
        data:
          value: "{{ capped_cycles + 1 }}"

      - service: input_text.set_value
        target:
          entity_id: input_text.humidifier_last_calibration
        data:
          value: >-
            {{- {"measured_ml_h": measured_rate | float | round(1),
                "new_rate_ml_h": new_rate | float | round(1),
                "active_hours": active_hrs | float | round(2),
                "model_ml": model_consumed | float | round(0),
                "cycle": (capped_cycles + 1) | int,
                "timestamp": now().isoformat()} | to_json -}}

      - action: script.notify_dispatch
        data:
          level: p2_maintenance
          tag: "humidifier_calibration_eva"
          title: "📊 Калибровка расхода увлажнителя (eva)"
          message: >-
            Бак {{ capacity | round(0) }} мл израсходован за {{ active_hrs | float | round(2) }} ч ({{ measured_rate }} мл/ч).
            Модель насчитала: {{ model_consumed | round(0) }} мл.
            Новая ставка: {{ new_rate }} мл/ч (цикл {{ capped_cycles + 1 }}).

  # ══════════════════════════════════════════════════════════════════════════
  #  EVA — ОБНАРУЖЕНИЕ ЗАПРАВКИ (снятие+установка бака + тихая проба 15с, fallback 20с)
  # ══════════════════════════════════════════════════════════════════════════
  - id: humidity_refill_detected
    alias: humidity_refill_detected
    description: "Автообнаружение заправки бака (eva): снятие и установка бака (вкл. Standby) + тихая проба 15с или 20с работы"
    mode: single
    initial_state: true

    trigger:
      - platform: state
        entity_id: binary_sensor.humidifier_puh_9105_puh_2709_water_tank
        from: "on"
        to: "off"
        id: "tank_replaced"
      - platform: state
        entity_id: humidifier.humidifier_puh_9105_puh_2709_humidifier
        to: "on"
        for:
          seconds: 55
        id: "power_on_55s"
      - platform: time_pattern
        minutes: "/15"
        id: "periodic_probe"
      - platform: event
        event_type: telegram_callback
        event_data:
          command: "/refill_eva"
        id: "tg_refill"

    condition:
      - or:
          - and:
              - condition: trigger
                id: "tank_replaced"
              - condition: template
                value_template: >-
                  {% set dur = (as_timestamp(trigger.to_state.last_changed) - as_timestamp(trigger.from_state.last_changed)) if (trigger.from_state is not none and trigger.to_state is not none) else 0 %}
                  {% set nr = states['input_boolean.humidifier_needs_refill'] %}
                  {% set nr_on = (nr is not none and nr.state == 'on') %}
                  {% set since_empty = (as_timestamp(trigger.from_state.last_changed) - as_timestamp(nr.last_changed)) if (nr_on and trigger.from_state is not none) else 9999 %}
                  {{ dur >= 15 and (not nr_on or since_empty > 10 or dur > 75) }}
          - and:
              - condition: trigger
                id: "power_on_55s"
              - condition: state
                entity_id: input_boolean.humidifier_needs_refill
                state: "on"
              - condition: template
                value_template: "{{ states('sensor.humidifier_puh_9105_puh_2709_error') in ['00', 'no_error', '02', 'child_lock'] }}"
          - and:
              - condition: trigger
                id: "periodic_probe"
              - condition: state
                entity_id: input_boolean.humidifier_needs_refill
                state: "on"
              - condition: state
                entity_id: binary_sensor.humidifier_puh_9105_puh_2709_available
                state: "on"
              - condition: state
                entity_id: humidifier.humidifier_puh_9105_puh_2709_humidifier
                state: "off"
              - condition: template
                value_template: >-
                  {% set nr = states['input_boolean.humidifier_needs_refill'] %}
                  {% set since_empty = (as_timestamp(now()) - as_timestamp(nr.last_changed)) if nr is not none else 0 %}
                  {{ (states('sensor.recommended_intensity') | int(0)) >= 1
                     and 9 <= now().hour < 22
                     and since_empty >= 600 }}
          - and:
              - condition: trigger
                id: "tg_refill"
              - condition: state
                entity_id: binary_sensor.humidifier_puh_9105_puh_2709_available
                state: "on"

    action:
      - if:
          - condition: template
            value_template: "{{ trigger.id == 'tg_refill' and trigger.event is defined and trigger.event.data is defined and trigger.event.data.id is defined }}"
        then:
          - action: telegram_bot.answer_callback_query
            continue_on_error: true
            data:
              callback_query_id: "{{ trigger.event.data.id }}"
              message: "Проверяю воду и запускаю увлажнитель (eva)..."
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.id in ['tank_replaced', 'periodic_probe', 'tg_refill'] }}"
            sequence:
              - service: switch.turn_on
                target:
                  entity_id: switch.humidifier_puh_9105_puh_2709_power
              - delay:
                  seconds: 1
              - service: humidifier.set_mode
                target:
                  entity_id: humidifier.humidifier_puh_9105_puh_2709_humidifier
                data:
                  mode: "sleep"
              - delay:
                  seconds: 2
              - if:
                  - condition: state
                    entity_id: humidifier.humidifier_puh_9105_puh_2709_humidifier
                    state: "on"
                then:
                  - service: switch.turn_off
                    continue_on_error: true
                    target:
                      entity_id:
                        - switch.humidifier_puh_9105_puh_2709_sound
                        - switch.humidifier_puh_9105_puh_2709_backlight
                  - service: switch.turn_on
                    continue_on_error: true
                    target:
                      entity_id: switch.humidifier_puh_9105_puh_2709_child_lock
              - wait_for_trigger:
                  - platform: state
                    entity_id: sensor.humidifier_puh_9105_puh_2709_error
                    to:
                      - "01"
                      - "low_water"
                  - platform: state
                    entity_id: humidifier.humidifier_puh_9105_puh_2709_humidifier
                    to: "off"
                timeout:
                  seconds: 50
                continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: "{{ wait.trigger is none }}"
                  - condition: state
                    entity_id: humidifier.humidifier_puh_9105_puh_2709_humidifier
                    state: "on"
                  - condition: template
                    value_template: "{{ states('sensor.humidifier_puh_9105_puh_2709_error') in ['00', 'no_error', '02', 'child_lock'] }}"
                  - condition: state
                    entity_id: binary_sensor.humidifier_puh_9105_puh_2709_water_tank
                    state: "off"
                then:
                  - service: script.turn_on
                    target:
                      entity_id: script.humidifier_eva_confirm_refill
                else:
                  - if:
                      - condition: template
                        value_template: >-
                          {{ is_state('humidifier.humidifier_puh_9105_puh_2709_humidifier', 'on')
                             or is_state('switch.humidifier_puh_9105_puh_2709_power', 'on') }}
                    then:
                      - service: switch.turn_off
                        target:
                          entity_id: switch.humidifier_puh_9105_puh_2709_power
        default:
          - service: script.turn_on
            target:
              entity_id: script.humidifier_eva_confirm_refill

  # ══════════════════════════════════════════════════════════════════════════
  #  EVA — ОШИБКА УСТРОЙСТВА
  # ══════════════════════════════════════════════════════════════════════════
  - id: humidity_device_error
    alias: humidity_device_error
    mode: single
    initial_state: true

    trigger:
      - platform: state
        entity_id: sensor.humidifier_puh_9105_puh_2709_error

    condition:
      - condition: template
        value_template: >
          {% set err = trigger.to_state.state %}
          {{ err not in ['00', 'no_error', '02', 'child_lock', '', 'unknown', 'unavailable'] }}
      - condition: template
        value_template: >
          {% set prev = trigger.from_state.state %}
          {{ prev in ['00', 'no_error', '02', 'child_lock', '', 'unknown', 'unavailable'] }}
      - condition: state
        entity_id: input_boolean.humidifier_needs_refill
        state: "off"

    action:
      - variables:
          power_ent: >
            {{ device_entities(device_id(trigger.entity_id)) | select('match', '^switch\\..*_power(_\\d+)?$') | first | default('switch.humidifier_puh_9105_puh_2709_power') }}
          error_code: "{{ trigger.to_state.state }}"
          cur_humidity: "{{ (states('sensor.humidity_filtered') if has_value('sensor.humidity_filtered') else states('sensor.sensor_eva_humidity')) | float(0) | round(1) }}"
          error_title: >
            {% if error_code in ['01', 'low_water'] %}
              💧 Мало воды в увлажнителе (eva)
            {% elif error_code in ['03', 'replace_filter'] %}
              🔧 Замените фильтр увлажнителя (eva)
            {% elif error_code in ['04', 'maximum_schedules'] %}
              ⚠️ Превышено количество расписаний (eva)
            {% elif error_code in ['05', 'clean_tank'] %}
              🧼 Очистите бак увлажнителя (eva)
            {% else %}
              ⚠️ Ошибка увлажнителя (eva)
            {% endif %}
          error_message: >
            {% if error_code in ['01', 'low_water'] %}
              Уровень воды слишком низкий.
              Наполните бак чистой водой — после установки бака увлажнитель продолжит работу автоматически.
            {% elif error_code in ['03', 'replace_filter'] %}
              Фильтр загрязнён и требует замены.
            {% elif error_code in ['04', 'maximum_schedules'] %}
              Достигнуто максимальное количество расписаний.
            {% elif error_code in ['05', 'clean_tank'] %}
              Бак требует очистки от накипи.
            {% else %}
              Код ошибки: {{ error_code }}
            {% endif %}

      - if:
          - condition: template
            value_template: "{{ error_code in ['01', 'low_water'] }}"
        then:
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.humidifier_needs_refill

      - service: switch.turn_off
        target:
          entity_id: "{{ power_ent }}"

      - action: script.notify_dispatch
        data:
          level: "{{ 'p3_info' if error_code in ['01', 'low_water'] else ('p2_maintenance' if error_code in ['03', 'replace_filter', '05', 'clean_tank'] else 'p1_urgent') }}"
          tag: "{{ 'humidifier_water_eva' if error_code in ['01', 'low_water'] else 'humidifier_error_eva' }}"
          title: "{{ error_title }}"
          inline_keyboard: "{{ ['✅ Бак заправлен:/refill_eva'] if error_code in ['01', 'low_water'] else [] }}"
          message: >
            {{ error_message }}

            Текущая влажность (eva): {{ cur_humidity }}%
            Целевая влажность (eva): {{ states('sensor.target_humidity') }}%

  # ══════════════════════════════════════════════════════════════════════════
  #  ZAP — ИНИЦИАЛИЗАЦИЯ УСТРОЙСТВ (area: zap)
  # ══════════════════════════════════════════════════════════════════════════
  - id: "Инициализация увлажнителей zap"
    alias: humidity_zap_device_setup
    mode: single
    max_exceeded: silent
    initial_state: true

    trigger:
      - platform: state
        entity_id: automation.humidity_zap_control_main
        to: "on"
      - platform: homeassistant
        event: start

    condition:
      - condition: state
        entity_id: automation.humidity_zap_control_main
        state: "on"

    action:
      - service: script.humidity_setup_area_devices
        data:
          area_name: "zap"
          recommended_entity: "sensor.humidity_zap_recommended_intensity"

  # ══════════════════════════════════════════════════════════════════════════
  #  ZAP — КОНТРОЛЬ РЕЖИМА И БЛОКИРОВКИ (area: zap)
  # ══════════════════════════════════════════════════════════════════════════
  - id: "Контроль режима увлажнителей zap"
    alias: humidity_zap_mode_enforcer
    description: "Гарантирует HA-only управление, погашенный дисплей/звук, child_lock и режим 'sleep' (zap)"
    mode: single
    max_exceeded: silent
    initial_state: true

    trigger:
      - platform: state
        entity_id: humidifier.humidifier_puh_9105_puh_2709_humidifier_2
        attribute: mode
        for:
          seconds: 15
        id: "mode_changed"
      - platform: state
        entity_id: switch.humidifier_puh_9105_puh_2709_warm_stream_2
        to: "off"
        for:
          seconds: 15
        id: "warm_stream_off"
      - platform: state
        entity_id: switch.humidifier_puh_9105_puh_2709_ioniser_2
        to: "off"
        for:
          seconds: 15
        id: "ioniser_off"
      - platform: state
        entity_id: switch.humidifier_puh_9105_puh_2709_child_lock_2
        to: "off"
        for:
          seconds: 10
        id: "child_lock_off"
      - platform: state
        entity_id: switch.humidifier_puh_9105_puh_2709_backlight_2
        to: "on"
        for:
          seconds: 10
        id: "backlight_on"
      - platform: state
        entity_id: switch.humidifier_puh_9105_puh_2709_sound_2
        to: "on"
        for:
          seconds: 10
        id: "sound_on"
      - platform: state
        entity_id: humidifier.humidifier_puh_9105_puh_2709_humidifier_2
        to: "on"
        for:
          seconds: 12
        id: "unexpected_power_on"
      - platform: state
        entity_id: humidifier.humidifier_puh_9105_puh_2709_humidifier_2
        to: "off"
        for:
          seconds: 15
        id: "unexpected_power_off"

    condition:
      - condition: state
        entity_id: automation.humidity_zap_control_main
        state: "on"
      - condition: template
        value_template: "{{ (state_attr('automation.humidity_zap_refill_detected', 'current') | int(0)) == 0 }}"
      - condition: template
        value_template: >
          {% set rec = states('sensor.humidity_zap_recommended_intensity') | int(0) %}
          {% set nr_on = is_state('input_boolean.humidifier_zap_needs_refill', 'on') %}
          {% set ns = namespace(needed=false) %}
          {% for dev in area_devices('zap') %}
            {% set ents = device_entities(dev) %}
            {% set hum = ents | select('match', '^humidifier\\.') | first | default('') %}
            {% set err = ents | select('match', '^sensor\\..*_error(_\\d+)?$') | first | default('') %}
            {% set tank = ents | select('match', '^binary_sensor\\..*_water_tank(_\\d+)?$') | first | default('') %}
            {% set snd = ents | select('match', '^switch\\..*_sound(_\\d+)?$') | first | default('') %}
            {% set bl = ents | select('match', '^switch\\..*_backlight(_\\d+)?$') | first | default('') %}
            {% set cl = ents | select('match', '^switch\\..*_child_lock(_\\d+)?$') | first | default('') %}
            {% set ion = ents | select('match', '^switch\\..*_ioniser(_\\d+)?$') | first | default('') %}
            {% set ws = ents | select('match', '^switch\\..*_warm_stream(_\\d+)?$') | first | default('') %}
            {% if hum != '' and states(hum) != 'unavailable' %}
              {% set dev_can_run = (err == '' or states(err) in ['00', 'no_error', '02', 'child_lock', '', 'unknown', 'unavailable'])
                                   and not nr_on
                                   and (tank == '' or not is_state(tank, 'on')) %}
              {% set lc = states[hum].last_changed if states[hum] is not none else none %}
              {% set age = (as_timestamp(now()) - as_timestamp(lc)) if lc is not none else 999 %}
              {% if is_state(hum, 'on') %}
                {% if rec == 0 or not dev_can_run %}
                  {% if not (nr_on and age < 70) %}
                    {% set ns.needed = true %}
                  {% endif %}
                {% elif state_attr(hum, 'mode') != 'sleep'
                      or (ws != '' and is_state(ws, 'off'))
                      or (ion != '' and is_state(ion, 'off'))
                      or (cl != '' and is_state(cl, 'off'))
                      or (snd != '' and is_state(snd, 'on'))
                      or (bl != '' and is_state(bl, 'on')) %}
                  {% set ns.needed = true %}
                {% endif %}
              {% else %}
                {% if rec >= 1 and dev_can_run %}
                  {% set ns.needed = true %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.needed }}

    action:
      - service: automation.trigger
        target:
          entity_id: automation.humidity_zap_control_main
        data:
          skip_condition: false

  # ══════════════════════════════════════════════════════════════════════════
  #  ZAP — ОСНОВНОЕ УПРАВЛЕНИЕ (area: zap)
  # ══════════════════════════════════════════════════════════════════════════
  - id: "Управление интенсивностью увлажнителей zap"
    alias: humidity_zap_control_main
    mode: queued
    max: 2
    max_exceeded: silent
    initial_state: true

    trigger:
      - platform: state
        entity_id: sensor.humidity_zap_recommended_intensity
        to:
          - "0"
          - "100"
      - platform: state
        entity_id: input_boolean.humidifier_zap_needs_refill
        to: "off"
      - platform: time_pattern
        minutes: "/2"

    condition:
      - condition: template
        value_template: "{{ has_value('sensor.humidity_zap_recommended_intensity') }}"

    action:
      - service: script.humidity_apply_area_control
        data:
          area_name: "zap"
          recommended_entity: "sensor.humidity_zap_recommended_intensity"

  # ══════════════════════════════════════════════════════════════════════════
  #  ZAP — КАЛИБРОВКА РАСХОДА (при опустошении бака)
  # ══════════════════════════════════════════════════════════════════════════
  - id: "Автокалибровка расхода увлажнителя zap"
    alias: humidifier_zap_calibrate_rates
    description: "Автокалибровка фактического расхода в sleep-режиме (zap, active_hours, bounded full-cycle)"
    mode: restart
    initial_state: true

    trigger:
      - platform: state
        entity_id: sensor.humidifier_puh_9105_puh_2709_error_2
        to:
          - "low_water"
          - "01"

    condition:
      - condition: template
        value_template: "{{ trigger.from_state is not none and trigger.from_state.state in ['00', 'no_error', '02', 'child_lock'] }}"
      - condition: state
        entity_id: input_boolean.humidifier_zap_full_cycle_valid
        state: "on"
      - condition: numeric_state
        entity_id: sensor.humidifier_zap_water_consumed
        above: 2500
        below: 7500

    action:
      - variables:
          capacity: "{{ states('input_number.humidifier_zap_tank_capacity_ml') | float(5000) }}"
          model_consumed: "{{ states('sensor.humidifier_zap_water_consumed') | float(0) }}"
          active_hrs: "{{ states('sensor.humidifier_zap_active_hours') | float(0) }}"
          old_rate: "{{ states('input_number.humidifier_zap_evaporation_rate_ml_h') | float(530.0) }}"
          cycles: "{{ states('input_number.humidifier_zap_calibration_cycles') | int(0) }}"
          capped_cycles: "{{ [cycles, 5] | min }}"
          measured_rate: >-
            {% set cap = capacity | float(5000) %}
            {% set hrs = active_hrs | float(0) %}
            {% set mod = model_consumed | float(0) %}
            {% set old_r = old_rate | float(530.0) %}
            {% if hrs >= 4.0 %}
              {{ (cap / hrs) | round(1) }}
            {% elif mod > 0 %}
              {{ (old_r * (cap / mod)) | round(1) }}
            {% else %}
              {{ old_r | round(1) }}
            {% endif %}
          new_rate: >-
            {% set old_r = old_rate | float(530.0) %}
            {% set meas = measured_rate | float(old_r) %}
            {% set cc = capped_cycles | int(0) %}
            {% set clamped = [[meas, old_r * 0.75] | max, old_r * 1.35] | min %}
            {% set blended = (old_r * cc + clamped) / (cc + 1) %}
            {{ [[blended, 300.0] | max, 620.0] | min | round(1) }}

      - delay: "00:03:00"

      - condition: state
        entity_id: input_boolean.humidifier_zap_needs_refill
        state: "on"
      - condition: template
        value_template: "{{ (state_attr('automation.humidity_zap_refill_detected', 'current') | int(0)) == 0 }}"
      - condition: template
        value_template: >-
          {% set t = states.binary_sensor.humidifier_puh_9105_puh_2709_water_tank_2 %}
          {{ is_state('binary_sensor.humidifier_puh_9105_puh_2709_water_tank_2', 'off')
             or (t is not none and (as_timestamp(now()) - as_timestamp(t.last_changed)) >= 150) }}

      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.humidifier_zap_full_cycle_valid

      - service: input_number.set_value
        target:
          entity_id: input_number.humidifier_zap_evaporation_rate_ml_h
        data:
          value: "{{ new_rate }}"

      - service: input_number.set_value
        target:
          entity_id: input_number.humidifier_zap_calibration_cycles
        data:
          value: "{{ capped_cycles + 1 }}"

      - service: input_text.set_value
        target:
          entity_id: input_text.humidifier_zap_last_calibration
        data:
          value: >-
            {{- {"measured_ml_h": measured_rate | float | round(1),
                "new_rate_ml_h": new_rate | float | round(1),
                "active_hours": active_hrs | float | round(2),
                "model_ml": model_consumed | float | round(0),
                "cycle": (capped_cycles + 1) | int,
                "timestamp": now().isoformat()} | to_json -}}

      - action: script.notify_dispatch
        data:
          level: p2_maintenance
          tag: "humidifier_calibration_zap"
          title: "📊 Калибровка расхода увлажнителя (zap)"
          message: >-
            Бак {{ capacity | round(0) }} мл израсходован за {{ active_hrs | float | round(2) }} ч ({{ measured_rate }} мл/ч).
            Модель насчитала: {{ model_consumed | round(0) }} мл.
            Новая ставка: {{ new_rate }} мл/ч (цикл {{ capped_cycles + 1 }}).

  # ══════════════════════════════════════════════════════════════════════════
  #  ZAP — ОБНАРУЖЕНИЕ ЗАПРАВКИ (снятие+установка бака + тихая проба 15с, fallback 20с)
  # ══════════════════════════════════════════════════════════════════════════
  - id: "Обнаружение заправки увлажнителя zap"
    alias: humidity_zap_refill_detected
    description: "Автообнаружение заправки бака (zap): снятие и установка бака (вкл. Standby) + тихая проба 15с или 20с работы"
    mode: single
    initial_state: true

    trigger:
      - platform: state
        entity_id: binary_sensor.humidifier_puh_9105_puh_2709_water_tank_2
        from: "on"
        to: "off"
        id: "tank_replaced"
      - platform: state
        entity_id: humidifier.humidifier_puh_9105_puh_2709_humidifier_2
        to: "on"
        for:
          seconds: 55
        id: "power_on_55s"
      - platform: time_pattern
        minutes: "/30"
        id: "periodic_probe"
      - platform: event
        event_type: telegram_callback
        event_data:
          command: "/refill_zap"
        id: "tg_refill"

    condition:
      - or:
          - and:
              - condition: trigger
                id: "tank_replaced"
              - condition: template
                value_template: >-
                  {% set dur = (as_timestamp(trigger.to_state.last_changed) - as_timestamp(trigger.from_state.last_changed)) if (trigger.from_state is not none and trigger.to_state is not none) else 0 %}
                  {% set nr = states['input_boolean.humidifier_zap_needs_refill'] %}
                  {% set nr_on = (nr is not none and nr.state == 'on') %}
                  {% set since_empty = (as_timestamp(trigger.from_state.last_changed) - as_timestamp(nr.last_changed)) if (nr_on and trigger.from_state is not none) else 9999 %}
                  {{ dur >= 15 and (not nr_on or since_empty > 10 or dur > 75) }}
          - and:
              - condition: trigger
                id: "power_on_55s"
              - condition: state
                entity_id: input_boolean.humidifier_zap_needs_refill
                state: "on"
              - condition: template
                value_template: "{{ states('sensor.humidifier_puh_9105_puh_2709_error_2') in ['00', 'no_error', '02', 'child_lock'] }}"
          - and:
              - condition: trigger
                id: "periodic_probe"
              - condition: state
                entity_id: input_boolean.humidifier_zap_needs_refill
                state: "on"
              - condition: state
                entity_id: binary_sensor.humidifier_puh_9105_puh_2709_available_2
                state: "on"
              - condition: state
                entity_id: humidifier.humidifier_puh_9105_puh_2709_humidifier_2
                state: "off"
              - condition: template
                value_template: >-
                  {% set nr = states['input_boolean.humidifier_zap_needs_refill'] %}
                  {% set since_empty = (as_timestamp(now()) - as_timestamp(nr.last_changed)) if nr is not none else 0 %}
                  {{ (states('sensor.humidity_zap_recommended_intensity') | int(0)) >= 1
                     and 9 <= now().hour < 22
                     and since_empty >= 900 }}
          - and:
              - condition: trigger
                id: "tg_refill"
              - condition: state
                entity_id: binary_sensor.humidifier_puh_9105_puh_2709_available_2
                state: "on"

    action:
      - if:
          - condition: template
            value_template: "{{ trigger.id == 'tg_refill' and trigger.event is defined and trigger.event.data is defined and trigger.event.data.id is defined }}"
        then:
          - action: telegram_bot.answer_callback_query
            continue_on_error: true
            data:
              callback_query_id: "{{ trigger.event.data.id }}"
              message: "Проверяю воду и запускаю увлажнитель (zap)..."
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.id in ['tank_replaced', 'periodic_probe', 'tg_refill'] }}"
            sequence:
              - service: switch.turn_on
                target:
                  entity_id: switch.humidifier_puh_9105_puh_2709_power_2
              - delay:
                  seconds: 1
              - service: humidifier.set_mode
                target:
                  entity_id: humidifier.humidifier_puh_9105_puh_2709_humidifier_2
                data:
                  mode: "sleep"
              - delay:
                  seconds: 2
              - if:
                  - condition: state
                    entity_id: humidifier.humidifier_puh_9105_puh_2709_humidifier_2
                    state: "on"
                then:
                  - service: switch.turn_off
                    continue_on_error: true
                    target:
                      entity_id:
                        - switch.humidifier_puh_9105_puh_2709_sound_2
                        - switch.humidifier_puh_9105_puh_2709_backlight_2
                  - service: switch.turn_on
                    continue_on_error: true
                    target:
                      entity_id: switch.humidifier_puh_9105_puh_2709_child_lock_2
              - wait_for_trigger:
                  - platform: state
                    entity_id: sensor.humidifier_puh_9105_puh_2709_error_2
                    to:
                      - "01"
                      - "low_water"
                  - platform: state
                    entity_id: humidifier.humidifier_puh_9105_puh_2709_humidifier_2
                    to: "off"
                timeout:
                  seconds: 50
                continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: "{{ wait.trigger is none }}"
                  - condition: state
                    entity_id: humidifier.humidifier_puh_9105_puh_2709_humidifier_2
                    state: "on"
                  - condition: template
                    value_template: "{{ states('sensor.humidifier_puh_9105_puh_2709_error_2') in ['00', 'no_error', '02', 'child_lock'] }}"
                  - condition: state
                    entity_id: binary_sensor.humidifier_puh_9105_puh_2709_water_tank_2
                    state: "off"
                then:
                  - service: script.turn_on
                    target:
                      entity_id: script.humidifier_zap_confirm_refill
                else:
                  - if:
                      - condition: template
                        value_template: >-
                          {{ is_state('humidifier.humidifier_puh_9105_puh_2709_humidifier_2', 'on')
                             or is_state('switch.humidifier_puh_9105_puh_2709_power_2', 'on') }}
                    then:
                      - service: switch.turn_off
                        target:
                          entity_id: switch.humidifier_puh_9105_puh_2709_power_2
        default:
          - service: script.turn_on
            target:
              entity_id: script.humidifier_zap_confirm_refill

  # ══════════════════════════════════════════════════════════════════════════
  #  ZAP — ОШИБКА УСТРОЙСТВА
  # ══════════════════════════════════════════════════════════════════════════
  - id: "Ошибка увлажнителя zap"
    alias: humidity_zap_device_error
    mode: single
    initial_state: true

    trigger:
      - platform: state
        entity_id: sensor.humidifier_puh_9105_puh_2709_error_2

    condition:
      - condition: template
        value_template: >
          {% set err = trigger.to_state.state %}
          {{ err not in ['00', 'no_error', '02', 'child_lock', '', 'unknown', 'unavailable'] }}
      - condition: template
        value_template: >
          {% set prev = trigger.from_state.state %}
          {{ prev in ['00', 'no_error', '02', 'child_lock', '', 'unknown', 'unavailable'] }}
      - condition: state
        entity_id: input_boolean.humidifier_zap_needs_refill
        state: "off"

    action:
      - variables:
          power_ent: >
            {{ device_entities(device_id(trigger.entity_id)) | select('match', '^switch\\..*_power(_\\d+)?$') | first | default('switch.humidifier_puh_9105_puh_2709_power_2') }}
          error_code: "{{ trigger.to_state.state }}"
          cur_humidity: "{{ (states('sensor.humidity_zap_filtered') if has_value('sensor.humidity_zap_filtered') else states('sensor.sensor_zap_humidity')) | float(0) | round(1) }}"
          error_title: >
            {% if error_code in ['01', 'low_water'] %}
              💧 Мало воды в увлажнителе (zap)
            {% elif error_code in ['03', 'replace_filter'] %}
              🔧 Замените фильтр увлажнителя (zap)
            {% elif error_code in ['04', 'maximum_schedules'] %}
              ⚠️ Превышено количество расписаний (zap)
            {% elif error_code in ['05', 'clean_tank'] %}
              🧼 Очистите бак увлажнителя (zap)
            {% else %}
              ⚠️ Ошибка увлажнителя (zap)
            {% endif %}
          error_message: >
            {% if error_code in ['01', 'low_water'] %}
              Уровень воды слишком низкий.
              Наполните бак чистой водой — после установки бака увлажнитель продолжит работу автоматически.
            {% elif error_code in ['03', 'replace_filter'] %}
              Фильтр загрязнён и требует замены.
            {% elif error_code in ['04', 'maximum_schedules'] %}
              Достигнуто максимальное количество расписаний.
            {% elif error_code in ['05', 'clean_tank'] %}
              Бак требует очистки от накипи.
            {% else %}
              Код ошибки: {{ error_code }}
            {% endif %}

      - if:
          - condition: template
            value_template: "{{ error_code in ['01', 'low_water'] }}"
        then:
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.humidifier_zap_needs_refill

      - service: switch.turn_off
        target:
          entity_id: "{{ power_ent }}"

      - action: script.notify_dispatch
        data:
          level: "{{ 'p3_info' if error_code in ['01', 'low_water'] else ('p2_maintenance' if error_code in ['03', 'replace_filter', '05', 'clean_tank'] else 'p1_urgent') }}"
          tag: "{{ 'humidifier_water_zap' if error_code in ['01', 'low_water'] else 'humidifier_error_zap' }}"
          title: "{{ error_title }}"
          inline_keyboard: "{{ ['✅ Бак заправлен:/refill_zap'] if error_code in ['01', 'low_water'] else [] }}"
          message: >
            {{ error_message }}

            Текущая влажность (zap): {{ cur_humidity }}%
            Целевая влажность (zap): {{ states('sensor.humidity_zap_target_humidity') }}%

  # ────────────────────────────────────────────────────────────────────────────
  #  Мониторинг доступности увлажнителей (offline >= 10 мин / восстановление)
  # ────────────────────────────────────────────────────────────────────────────
  - id: humidity_device_offline_watchdog
    alias: humidity_device_offline_watchdog
    description: "Уведомление при потере связи с увлажнителем (>= 10 мин) и авто-сброс при возврате в сеть"
    mode: parallel
    max: 4
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.humidifier_puh_9105_puh_2709_available
          - binary_sensor.humidifier_puh_9105_puh_2709_available_2
        to: "off"
        for:
          minutes: 10
        id: "offline"
      - platform: state
        entity_id:
          - binary_sensor.humidifier_puh_9105_puh_2709_available
          - binary_sensor.humidifier_puh_9105_puh_2709_available_2
        to: "on"
        id: "online"
    variables:
      is_zap: "{{ (trigger.entity_id | default('')) is search('_2$') }}"
      room_key: "{{ 'zap' if is_zap else 'eva' }}"
      room_name: "{{ 'Зап (кабинет)' if is_zap else 'Ева (детская)' }}"
      notify_tag: "{{ 'humidifier_offline_' ~ room_key }}"
    action:
      - choose:
          - conditions:
              - condition: trigger
                id: "offline"
            sequence:
              - action: script.notify_dispatch
                data:
                  level: "p2_maintenance"
                  tag: "{{ notify_tag }}"
                  title: "⚠️ Увлажнитель {{ room_key }} офлайн"
                  message: >
                    Увлажнитель {{ room_name }} не выходит на связь более 10 минут.
                    Проверьте питание устройства и подключение к Wi-Fi / MQTT.
          - conditions:
              - condition: trigger
                id: "online"
              - condition: template
                value_template: >-
                  {{ trigger.from_state is not none
                     and trigger.from_state.state in ['off', 'unavailable']
                     and (as_timestamp(now()) - as_timestamp(trigger.from_state.last_changed)) >= 600 }}
            sequence:
              - action: script.notify_clear
                data:
                  tag: "{{ notify_tag }}"
                  clear_mobile: true
              - action: script.notify_dispatch
                data:
                  level: "p2_maintenance"
                  tag: "{{ notify_tag }}"
                  title: "✅ Увлажнитель {{ room_key }} снова в сети"
                  message: "Связь с увлажнителем {{ room_name }} восстановлена."
