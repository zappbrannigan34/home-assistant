# package: ventilation_multiroom
# Version: 3.2.0
# Last Updated: 2026-11-24
# Description: Unified room-agnostic ventilation engine (custom_templates/ventilation.jinja + shared scripts) for ZAP & EVA, routed through script.notify_dispatch

# ──────────────────────────────────────────────────────────────────────────────
#  INPUT NUMBERS (настройки регулирования по комнатам, без initial:)
# ──────────────────────────────────────────────────────────────────────────────

input_number:
  # Zap
  ventilation_target_co2:
    name: "Ventilation Target CO2"
    min: 300
    max: 1000
    step: 50
    unit_of_measurement: "ppm"
    icon: mdi:molecule-co2
    mode: box

  ventilation_min_position:
    name: "Ventilation Min Position"
    min: 0
    max: 50
    step: 5
    unit_of_measurement: "%"
    icon: mdi:arrow-collapse-down
    mode: box

  ventilation_max_position:
    name: "Ventilation Max Position"
    min: 2
    max: 100
    step: 5
    unit_of_measurement: "%"
    icon: mdi:arrow-collapse-up
    mode: box

  ventilation_min_outdoor_temp:
    name: "Ventilation Min Outdoor Temp"
    min: -30
    max: 20
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:thermometer-alert
    mode: box

  ventilation_min_indoor_temp:
    name: "Ventilation Min Indoor Temp"
    min: 10
    max: 25
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:home-thermometer
    mode: box

  ventilation_deadband_ppm:
    name: "Ventilation Deadband PPM"
    min: 10
    max: 150
    step: 5
    unit_of_measurement: "ppm"
    icon: mdi:arrow-left-right
    mode: box

  # Eva
  ventilation_eva_target_co2:
    name: "Ventilation Eva Target CO2"
    min: 300
    max: 1000
    step: 50
    unit_of_measurement: "ppm"
    icon: mdi:molecule-co2
    mode: box

  ventilation_eva_min_position:
    name: "Ventilation Eva Min Position"
    min: 0
    max: 50
    step: 5
    unit_of_measurement: "%"
    icon: mdi:arrow-collapse-down
    mode: box

  ventilation_eva_max_position:
    name: "Ventilation Eva Max Position"
    min: 2
    max: 100
    step: 5
    unit_of_measurement: "%"
    icon: mdi:arrow-collapse-up
    mode: box

  ventilation_eva_min_outdoor_temp:
    name: "Ventilation Eva Min Outdoor Temp"
    min: -30
    max: 20
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:thermometer-alert
    mode: box

  ventilation_eva_min_indoor_temp:
    name: "Ventilation Eva Min Indoor Temp"
    min: 10
    max: 25
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:home-thermometer
    mode: box

  ventilation_eva_deadband_ppm:
    name: "Ventilation Eva Deadband PPM"
    min: 10
    max: 150
    step: 5
    unit_of_measurement: "ppm"
    icon: mdi:arrow-left-right
    mode: box

input_boolean:
  ventilation_use_indoor_temperature:
    name: "Ventilation Use Indoor Temperature"
    icon: mdi:home-thermometer-outline

  ventilation_eva_use_indoor_temperature:
    name: "Ventilation Eva Use Indoor Temperature"
    icon: mdi:home-thermometer-outline

input_datetime:
  ventilation_last_adjustment:
    name: "Ventilation Last Adjustment"
    has_date: true
    has_time: true
    icon: mdi:clock-check-outline

  ventilation_eva_last_adjustment:
    name: "Ventilation Eva Last Adjustment"
    has_date: true
    has_time: true
    icon: mdi:clock-check-outline

# ──────────────────────────────────────────────────────────────────────────────
#  GROUPED COVERS (логические приводы комнаты)
# ──────────────────────────────────────────────────────────────────────────────

cover:
  - platform: group
    name: "Ventilation Zap Group"
    unique_id: ventilation_zap_group
    entities:
      - cover.drivent_zap_left_driventokonnyi_privod
      - cover.drivent_zap_back_driventokonnyi_privod

# ──────────────────────────────────────────────────────────────────────────────
#  STATISTICS / FILTER / DERIVATIVE SENSORS
# ──────────────────────────────────────────────────────────────────────────────

sensor:
  - platform: statistics
    name: "Ventilation CO2 Mean 30m"
    unique_id: ventilation_co2_mean_30m
    entity_id: sensor.sensor_zap_co2
    state_characteristic: average_step
    max_age:
      minutes: 30
    sampling_size: 240
    keep_last_sample: true
    precision: 1

  - platform: statistics
    name: "Ventilation CO2 Change 30m"
    unique_id: ventilation_co2_change_30m
    entity_id: sensor.sensor_zap_co2
    state_characteristic: change
    max_age:
      minutes: 30
    sampling_size: 240
    keep_last_sample: true
    precision: 1

  - platform: statistics
    name: "Ventilation Eva CO2 Mean 30m"
    unique_id: ventilation_eva_co2_mean_30m
    entity_id: sensor.sensor_eva_co2
    state_characteristic: average_step
    max_age:
      minutes: 30
    sampling_size: 240
    keep_last_sample: true
    precision: 1

  - platform: statistics
    name: "Ventilation Eva CO2 Change 30m"
    unique_id: ventilation_eva_co2_change_30m
    entity_id: sensor.sensor_eva_co2
    state_characteristic: change
    max_age:
      minutes: 30
    sampling_size: 240
    keep_last_sample: true
    precision: 1

  - platform: filter
    name: "Ventilation CO2 Filtered"
    unique_id: ventilation_co2_filtered
    entity_id: sensor.sensor_zap_co2
    filters:
      - filter: lowpass
        time_constant: 8
        precision: 1

  - platform: filter
    name: "Ventilation Eva CO2 Filtered"
    unique_id: ventilation_eva_co2_filtered
    entity_id: sensor.sensor_eva_co2
    filters:
      - filter: lowpass
        time_constant: 8
        precision: 1

  - platform: derivative
    source: sensor.ventilation_co2_filtered
    name: "Ventilation CO2 Slope"
    unique_id: ventilation_co2_slope
    round: 3
    unit_time: min
    time_window: "00:15:00"

  - platform: derivative
    source: sensor.ventilation_eva_co2_filtered
    name: "Ventilation Eva CO2 Slope"
    unique_id: ventilation_eva_co2_slope
    round: 3
    unit_time: min
    time_window: "00:15:00"

# ──────────────────────────────────────────────────────────────────────────────
#  TEMPLATE SENSORS (общие макросы из custom_templates/ventilation.jinja)
# ──────────────────────────────────────────────────────────────────────────────

template:
  # ══ ZAP ═════════════════════════════════════════════════════════════════════
  - trigger:
      - platform: time_pattern
        minutes: "/1"
      - platform: state
        entity_id:
          - sensor.ventilation_co2_filtered
          - sensor.ventilation_co2_slope
      - platform: homeassistant
        event: start
    sensor:
      - name: "CO2 Trend"
        unique_id: ventilation_co2_trend
        icon: mdi:trending-up
        availability: >
          {% from 'ventilation.jinja' import calc_co2_trend %}
          {{ (calc_co2_trend('zap') | from_json).available }}
        state: >
          {% from 'ventilation.jinja' import calc_co2_trend %}
          {{ (calc_co2_trend('zap') | from_json).state }}
        attributes:
          current_co2: "{% from 'ventilation.jinja' import calc_co2_trend %}{{ (calc_co2_trend('zap') | from_json).attributes.current_co2 }}"
          co2_filtered: "{% from 'ventilation.jinja' import calc_co2_trend %}{{ (calc_co2_trend('zap') | from_json).attributes.co2_filtered }}"
          co2_slope_ppm_min: "{% from 'ventilation.jinja' import calc_co2_trend %}{{ (calc_co2_trend('zap') | from_json).attributes.co2_slope_ppm_min }}"
          trend_threshold_ppm_min: 0.5
          filter_type: "ema_lowpass"

  - trigger:
      - platform: time_pattern
        minutes: "/1"
        id: observation
      - platform: time_pattern
        minutes: "29"
        id: cycle_end
      - platform: time_pattern
        minutes: "59"
        id: cycle_end
      - platform: homeassistant
        event: start
        id: startup
    sensor:
      - name: "Ventilation ZAP Room Model"
        unique_id: ventilation_zap_room_model
        unit_of_measurement: "%"
        icon: mdi:chart-bell-curve-cumulative
        state: >
          {% from 'ventilation.jinja' import calc_room_model %}
          {% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}
          {% set tid = trigger.id if (trigger is defined and trigger.id is defined) else 'observation' %}
          {{ (calc_room_model('zap', p, tid) | from_json).state }}
        attributes:
          model_generation: 3
          model_state: "{% from 'ventilation.jinja' import calc_room_model %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{% set tid = trigger.id if (trigger is defined and trigger.id is defined) else 'observation' %}{{ (calc_room_model('zap', p, tid) | from_json).attributes.model_state }}"
          closed_load_estimate_ppm_min: "{% from 'ventilation.jinja' import calc_room_model %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{% set tid = trigger.id if (trigger is defined and trigger.id is defined) else 'observation' %}{{ (calc_room_model('zap', p, tid) | from_json).attributes.closed_load_estimate_ppm_min }}"
          ventilation_gain_estimate_ppm_min_per_fraction: "{% from 'ventilation.jinja' import calc_room_model %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{% set tid = trigger.id if (trigger is defined and trigger.id is defined) else 'observation' %}{{ (calc_room_model('zap', p, tid) | from_json).attributes.ventilation_gain_estimate_ppm_min_per_fraction }}"
          tau_estimate_min: "{% from 'ventilation.jinja' import calc_room_model %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{% set tid = trigger.id if (trigger is defined and trigger.id is defined) else 'observation' %}{{ (calc_room_model('zap', p, tid) | from_json).attributes.tau_estimate_min }}"
          accepted_closed_load_estimate_ppm_min: "{% from 'ventilation.jinja' import calc_room_model %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{% set tid = trigger.id if (trigger is defined and trigger.id is defined) else 'observation' %}{{ (calc_room_model('zap', p, tid) | from_json).attributes.accepted_closed_load_estimate_ppm_min }}"
          accepted_ventilation_gain_estimate_ppm_min_per_fraction: "{% from 'ventilation.jinja' import calc_room_model %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{% set tid = trigger.id if (trigger is defined and trigger.id is defined) else 'observation' %}{{ (calc_room_model('zap', p, tid) | from_json).attributes.accepted_ventilation_gain_estimate_ppm_min_per_fraction }}"
          accepted_tau_estimate_min: "{% from 'ventilation.jinja' import calc_room_model %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{% set tid = trigger.id if (trigger is defined and trigger.id is defined) else 'observation' %}{{ (calc_room_model('zap', p, tid) | from_json).attributes.accepted_tau_estimate_min }}"
          accepted_model_generation: "{% from 'ventilation.jinja' import calc_room_model %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{% set tid = trigger.id if (trigger is defined and trigger.id is defined) else 'observation' %}{{ (calc_room_model('zap', p, tid) | from_json).attributes.accepted_model_generation }}"
          accepted_total_sample_count: "{% from 'ventilation.jinja' import calc_room_model %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{% set tid = trigger.id if (trigger is defined and trigger.id is defined) else 'observation' %}{{ (calc_room_model('zap', p, tid) | from_json).attributes.accepted_total_sample_count }}"
          coefficient_source: "{% from 'ventilation.jinja' import calc_room_model %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{% set tid = trigger.id if (trigger is defined and trigger.id is defined) else 'observation' %}{{ (calc_room_model('zap', p, tid) | from_json).attributes.coefficient_source }}"
          load_sample_count: "{% from 'ventilation.jinja' import calc_room_model %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{% set tid = trigger.id if (trigger is defined and trigger.id is defined) else 'observation' %}{{ (calc_room_model('zap', p, tid) | from_json).attributes.load_sample_count }}"
          gain_sample_count: "{% from 'ventilation.jinja' import calc_room_model %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{% set tid = trigger.id if (trigger is defined and trigger.id is defined) else 'observation' %}{{ (calc_room_model('zap', p, tid) | from_json).attributes.gain_sample_count }}"
          tau_sample_count: "{% from 'ventilation.jinja' import calc_room_model %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{% set tid = trigger.id if (trigger is defined and trigger.id is defined) else 'observation' %}{{ (calc_room_model('zap', p, tid) | from_json).attributes.tau_sample_count }}"
          model_confidence_pct: "{% from 'ventilation.jinja' import calc_room_model %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{% set tid = trigger.id if (trigger is defined and trigger.id is defined) else 'observation' %}{{ (calc_room_model('zap', p, tid) | from_json).attributes.model_confidence_pct }}"
          sample_applied_position: "{% from 'ventilation.jinja' import calc_room_model %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{% set tid = trigger.id if (trigger is defined and trigger.id is defined) else 'observation' %}{{ (calc_room_model('zap', p, tid) | from_json).attributes.sample_applied_position }}"
          sample_slope_ppm_min: "{% from 'ventilation.jinja' import calc_room_model %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{% set tid = trigger.id if (trigger is defined and trigger.id is defined) else 'observation' %}{{ (calc_room_model('zap', p, tid) | from_json).attributes.sample_slope_ppm_min }}"
          last_target: "{% from 'ventilation.jinja' import calc_room_model %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{% set tid = trigger.id if (trigger is defined and trigger.id is defined) else 'observation' %}{{ (calc_room_model('zap', p, tid) | from_json).attributes.last_target }}"
          last_min_position: "{% from 'ventilation.jinja' import calc_room_model %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{% set tid = trigger.id if (trigger is defined and trigger.id is defined) else 'observation' %}{{ (calc_room_model('zap', p, tid) | from_json).attributes.last_min_position }}"
          last_max_position: "{% from 'ventilation.jinja' import calc_room_model %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{% set tid = trigger.id if (trigger is defined and trigger.id is defined) else 'observation' %}{{ (calc_room_model('zap', p, tid) | from_json).attributes.last_max_position }}"
          last_model_update: "{% from 'ventilation.jinja' import calc_room_model %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{% set tid = trigger.id if (trigger is defined and trigger.id is defined) else 'observation' %}{{ (calc_room_model('zap', p, tid) | from_json).attributes.last_model_update }}"

  - sensor:
      - name: "Ventilation ZAP Safety Temperature"
        unique_id: ventilation_zap_safety_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        icon: mdi:shield-thermometer
        state: >
          {% from 'ventilation.jinja' import calc_safety_temp %}
          {{ (calc_safety_temp('zap') | from_json).state }}
        attributes:
          requested_mode: "{% from 'ventilation.jinja' import calc_safety_temp %}{{ (calc_safety_temp('zap') | from_json).attributes.requested_mode }}"
          source: "{% from 'ventilation.jinja' import calc_safety_temp %}{{ (calc_safety_temp('zap') | from_json).attributes.source }}"
          selected_threshold: "{% from 'ventilation.jinja' import calc_safety_temp %}{{ (calc_safety_temp('zap') | from_json).attributes.selected_threshold }}"
          unsafe: "{% from 'ventilation.jinja' import calc_safety_temp %}{{ (calc_safety_temp('zap') | from_json).attributes.unsafe }}"
          fallback_active: "{% from 'ventilation.jinja' import calc_safety_temp %}{{ (calc_safety_temp('zap') | from_json).attributes.fallback_active }}"
          primary_room_temperature: "{% from 'ventilation.jinja' import calc_safety_temp %}{{ (calc_safety_temp('zap') | from_json).attributes.primary_room_temperature }}"
          outdoor_temperature: "{% from 'ventilation.jinja' import calc_safety_temp %}{{ (calc_safety_temp('zap') | from_json).attributes.outdoor_temperature }}"

  - trigger:
      - platform: time_pattern
        minutes: "/1"
        id: minute_tick
      - platform: homeassistant
        event: start
        id: startup
    sensor:
      - name: "Ventilation ZAP Thermal Cap"
        unique_id: ventilation_zap_thermal_cap
        unit_of_measurement: "%"
        icon: mdi:home-thermometer-outline
        state: >
          {% from 'ventilation.jinja' import calc_thermal_cap %}
          {% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}
          {{ (calc_thermal_cap('zap', p) | from_json).state }}
        attributes:
          room_temperature: "{% from 'ventilation.jinja' import calc_thermal_cap %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{{ (calc_thermal_cap('zap', p) | from_json).attributes.room_temperature }}"
          room_temperature_source: "{% from 'ventilation.jinja' import calc_thermal_cap %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{{ (calc_thermal_cap('zap', p) | from_json).attributes.room_temperature_source }}"
          soft_upper_temperature: "{% from 'ventilation.jinja' import calc_thermal_cap %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{{ (calc_thermal_cap('zap', p) | from_json).attributes.soft_upper_temperature }}"
          soft_temperature_span_c: "{% from 'ventilation.jinja' import calc_thermal_cap %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{{ (calc_thermal_cap('zap', p) | from_json).attributes.soft_temperature_span_c }}"
          room_temperature_slope_c_per_min: "{% from 'ventilation.jinja' import calc_thermal_cap %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{{ (calc_thermal_cap('zap', p) | from_json).attributes.room_temperature_slope_c_per_min }}"
          predicted_room_temperature_10m: "{% from 'ventilation.jinja' import calc_thermal_cap %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{{ (calc_thermal_cap('zap', p) | from_json).attributes.predicted_room_temperature_10m }}"
          indoor_minimum_temperature: "{% from 'ventilation.jinja' import calc_thermal_cap %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{{ (calc_thermal_cap('zap', p) | from_json).attributes.indoor_minimum_temperature }}"
          outdoor_minimum_temperature: "{% from 'ventilation.jinja' import calc_thermal_cap %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{{ (calc_thermal_cap('zap', p) | from_json).attributes.outdoor_minimum_temperature }}"
          predicted_temperature_headroom_c: "{% from 'ventilation.jinja' import calc_thermal_cap %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{{ (calc_thermal_cap('zap', p) | from_json).attributes.predicted_temperature_headroom_c }}"
          normalized_room_factor: "{% from 'ventilation.jinja' import calc_thermal_cap %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{{ (calc_thermal_cap('zap', p) | from_json).attributes.normalized_room_factor }}"
          normalized_outdoor_factor: "{% from 'ventilation.jinja' import calc_thermal_cap %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{{ (calc_thermal_cap('zap', p) | from_json).attributes.normalized_outdoor_factor }}"
          cooling_time_to_floor_minutes: "{% from 'ventilation.jinja' import calc_thermal_cap %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{{ (calc_thermal_cap('zap', p) | from_json).attributes.cooling_time_to_floor_minutes }}"
          thermal_opening_factor: "{% from 'ventilation.jinja' import calc_thermal_cap %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{{ (calc_thermal_cap('zap', p) | from_json).attributes.thermal_opening_factor }}"
          outdoor_heat_loss_risk: "{% from 'ventilation.jinja' import calc_thermal_cap %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{{ (calc_thermal_cap('zap', p) | from_json).attributes.outdoor_heat_loss_risk }}"
          thermal_limit_active: "{% from 'ventilation.jinja' import calc_thermal_cap %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{{ (calc_thermal_cap('zap', p) | from_json).attributes.thermal_limit_active }}"
          thermal_limit_reason: "{% from 'ventilation.jinja' import calc_thermal_cap %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{{ (calc_thermal_cap('zap', p) | from_json).attributes.thermal_limit_reason }}"
          minimum_ventilation_position: "{% from 'ventilation.jinja' import calc_thermal_cap %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{{ (calc_thermal_cap('zap', p) | from_json).attributes.minimum_ventilation_position }}"
          outdoor_temperature: "{% from 'ventilation.jinja' import calc_thermal_cap %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{{ (calc_thermal_cap('zap', p) | from_json).attributes.outdoor_temperature }}"
          previous_room_temperature: "{% from 'ventilation.jinja' import calc_thermal_cap %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{{ (calc_thermal_cap('zap', p) | from_json).attributes.previous_room_temperature }}"
          last_update_ts: "{% from 'ventilation.jinja' import calc_thermal_cap %}{% set p = this.attributes if (this is defined and this.attributes is mapping) else {} %}{{ (calc_thermal_cap('zap', p) | from_json).attributes.last_update_ts }}"

  - trigger:
      - platform: time_pattern
        minutes: "/1"
        id: minute_tick
      - platform: homeassistant
        event: start
        id: startup
    sensor:
      - name: "Ventilation Forecast CO2 30m"
        unique_id: ventilation_forecast_co2_30m
        unit_of_measurement: "ppm"
        icon: mdi:chart-timeline-variant
        availability: >
          {% from 'ventilation.jinja' import calc_forecast_co2 %}
          {{ (calc_forecast_co2('zap') | from_json).available }}
        state: >
          {% from 'ventilation.jinja' import calc_forecast_co2 %}
          {{ (calc_forecast_co2('zap') | from_json).state }}
        attributes:
          raw_co2: "{% from 'ventilation.jinja' import calc_forecast_co2 %}{{ (calc_forecast_co2('zap') | from_json).attributes.raw_co2 }}"
          filtered_co2: "{% from 'ventilation.jinja' import calc_forecast_co2 %}{{ (calc_forecast_co2('zap') | from_json).attributes.filtered_co2 }}"
          slope_ppm_min: "{% from 'ventilation.jinja' import calc_forecast_co2 %}{{ (calc_forecast_co2('zap') | from_json).attributes.slope_ppm_min }}"
          forecast_horizon_min: 10

      - name: "Ventilation Forecast Error 30m"
        unique_id: ventilation_forecast_error_30m
        unit_of_measurement: "ppm"
        state_class: measurement
        icon: mdi:delta
        availability: >
          {% from 'ventilation.jinja' import calc_forecast_error %}
          {{ (calc_forecast_error('zap') | from_json).available }}
        state: >
          {% from 'ventilation.jinja' import calc_forecast_error %}
          {{ (calc_forecast_error('zap') | from_json).state }}
        attributes:
          forecast_co2_30m: "{% from 'ventilation.jinja' import calc_forecast_error %}{{ (calc_forecast_error('zap') | from_json).attributes.forecast_co2_30m }}"
          target: "{% from 'ventilation.jinja' import calc_forecast_error %}{{ (calc_forecast_error('zap') | from_json).attributes.target }}"
