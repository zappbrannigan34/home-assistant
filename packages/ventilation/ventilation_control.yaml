  # ════════════════════════════════════════════════════════════════════════════
  #  БЛОК 5: ZAP — 10m forecast + equilibrium-seeking PI-style controller
  # ════════════════════════════════════════════════════════════════════════════
  - trigger:
      - platform: time_pattern
        minutes: "/1"
        id: minute_tick
      - platform: homeassistant
        event: start
        id: startup
    sensor:
      - name: "Ventilation Forecast CO2 30m"
        unique_id: ventilation_forecast_co2_30m
        unit_of_measurement: "ppm"
        icon: mdi:chart-timeline-variant
        availability: >
          {{ has_value('sensor.sensor_zap_co2') and
             has_value('sensor.ventilation_co2_filtered') and
             has_value('sensor.ventilation_co2_slope') }}
        state: >
          {% set raw_co2 = states('sensor.sensor_zap_co2') | float(650) %}
          {% set filtered = states('sensor.ventilation_co2_filtered') | float(raw_co2) %}
          {% set slope = states('sensor.ventilation_co2_slope') | float(0) %}
          {{ (filtered + slope * 10) | round(1) }}
        attributes:
          raw_co2: "{{ states('sensor.sensor_zap_co2') | float(0) }}"
          filtered_co2: "{{ states('sensor.ventilation_co2_filtered') | float(0) }}"
          slope_ppm_min: "{{ states('sensor.ventilation_co2_slope') | float(0) }}"
          forecast_horizon_min: 10

      - name: "Ventilation Forecast Error 30m"
        unique_id: ventilation_forecast_error_30m
        unit_of_measurement: "ppm"
        state_class: measurement
        icon: mdi:delta
        availability: >
          {{ has_value('sensor.ventilation_forecast_co2_30m') }}
        state: >
          {% set forecast = states('sensor.ventilation_forecast_co2_30m') | float(650) %}
          {% set target = states('input_number.ventilation_target_co2') | float(650) %}
          {{ (forecast - target) | round(0) }}
        attributes:
          forecast_co2_30m: "{{ states('sensor.ventilation_forecast_co2_30m') | float(0) }}"
          target: "{{ states('input_number.ventilation_target_co2') | float(650) }}"
          deadband_ppm: 50

      - name: "Ventilation Recommended Position"
        unique_id: ventilation_recommended_position
        unit_of_measurement: "%"
        icon: mdi:window-open-variant
        availability: >
          {{ has_value('sensor.sensor_zap_co2') and
             has_value('sensor.ventilation_co2_filtered') and
             has_value('sensor.ventilation_co2_slope') and
             has_value('sensor.ventilation_forecast_error_30m') }}
        state: >
          {% set raw_co2 = states('sensor.sensor_zap_co2') | float(650) %}
          {% set filtered = states('sensor.ventilation_co2_filtered') | float(raw_co2) %}
          {% set slope = states('sensor.ventilation_co2_slope') | float(0) %}
          {% set forecast_co2 = states('sensor.ventilation_forecast_co2_30m') | float(filtered) %}
          {% set min_pos = states('input_number.ventilation_min_position') | float(0) %}
          {% set max_pos = states('input_number.ventilation_max_position') | float(80) %}
          {% set target = states('input_number.ventilation_target_co2') | float(650) %}
          {% set deadband = states('input_number.ventilation_deadband_ppm') | float(50) %}
          {% set span = [max_pos - min_pos, 0] | max %}
          {% set error = filtered - target %}
          {% set error_outside = 0 if (error | abs) <= deadband else ((error | abs) - deadband) * (1 if error > 0 else -1) %}
          {% set previous_load = state_attr('sensor.ventilation_recommended_position', 'closed_load_estimate_ppm_min') | float(2.597) %}
          {% set previous_gain = state_attr('sensor.ventilation_recommended_position', 'vent_gain_estimate_ppm_min_per_fraction') | float(6.681) %}
          {% set previous_tau = state_attr('sensor.ventilation_recommended_position', 'tau_estimate_min') | float(30.715) %}
          {% set load = state_attr('sensor.ventilation_zap_room_model', 'accepted_closed_load_estimate_ppm_min') | float(previous_load) %}
          {% set gain = state_attr('sensor.ventilation_zap_room_model', 'accepted_ventilation_gain_estimate_ppm_min_per_fraction') | float(previous_gain) %}
          {% set tau = state_attr('sensor.ventilation_zap_room_model', 'accepted_tau_estimate_min') | float(previous_tau) %}
          {% set model_changed = (load - previous_load) | abs > 0.0005 or (gain - previous_gain) | abs > 0.0005 or (tau - previous_tau) | abs > 0.0005 %}
          {% set equilibrium_fraction = [[load / ([gain, 0.05] | max), 0] | max, 1] | min %}
          {% set equilibrium = min_pos + span * equilibrium_fraction %}
          {% set kp = (0.20 * span) / ([gain * tau, 5] | max) %}
          {% set kp = [[kp, 0.002] | max, 0.10] | min %}
          {% set ti = [[tau * 2, 30] | max, 180] | min %}
          {% set ki = kp / ti %}
          {% set forecast_delta = forecast_co2 - filtered %}
