# ──────────────────────────────────────────────────────────────────────────────
#  SHARED SCRIPTS (единая исполнительная логика для всех комнат)
# ──────────────────────────────────────────────────────────────────────────────

script:
  ventilation_apply_room_control:
    alias: "Вентиляция: применить рекомендуемую позицию"
    mode: parallel
    max: 4
    fields:
      room:
        description: "Ключ комнаты (zap или eva)"
        required: true
    sequence:
      - variables:
          gate: >
            {% from 'ventilation.jinja' import eval_control_gate %}
            {{ eval_control_gate(room) | from_json }}
      - service: cover.set_cover_position
        target:
          entity_id: "{{ gate.cover }}"
        data:
          position: "{{ gate.recommended }}"
      - service: input_datetime.set_datetime
        target:
          entity_id: "{{ gate.last_adjustment }}"
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  ventilation_apply_safety_close:
    alias: "Вентиляция: аварийное закрытие окна"
    mode: parallel
    max: 4
    fields:
      room:
        description: "Ключ комнаты (zap или eva)"
        required: true
    sequence:
      - variables:
          safety: >
            {% from 'ventilation.jinja' import eval_safety_close %}
            {{ eval_safety_close(room) | from_json }}
      - service: cover.close_cover
        target:
          entity_id: "{{ safety.cover }}"
      - service: input_datetime.set_datetime
        target:
          entity_id: "{{ safety.last_adjustment }}"
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: script.notify_dispatch
        data:
          level: "{{ 'p1_urgent' if safety.reason == 'overload' else 'p3_info' }}"
          tag: "ventilation_safety_{{ room }}"
          title: "🪟 Окно {{ safety.label }} закрыто (безопасность)"
          message: >
            Причина: {{ safety.reason }}.
            {% if safety.reason in ['cold_indoor_primary', 'cold_outdoor'] %}
              Выбранная температура: {{ safety.selected_temp }}°C.
              Источник: {{ safety.source }}.
              Минимум: {{ safety.threshold }}°C.
            {% elif safety.reason == 'temperature_sources_unavailable' %}
              Все разрешённые источники температуры недоступны. Выполнено fail-safe закрытие.
            {% elif safety.reason == 'overload' %}
              Привод обнаружил перегрузку ({{ safety.label }}). Проверьте окна.
            {% elif safety.reason == 'co2_sensor_lost' %}
              Датчик CO2 недоступен. Окно закрыто в целях безопасности.
            {% endif %}

  ventilation_notify_device_error:
    alias: "Вентиляция: уведомление о перегрузке привода"
    mode: parallel
    max: 4
    fields:
      room:
        description: "Ключ комнаты (zap или eva)"
        required: true
    sequence:
      - variables:
          info: >
            {% from 'ventilation.jinja' import get_device_error_info %}
            {{ get_device_error_info(room) | from_json }}
      - action: script.notify_dispatch
        data:
          level: p1_urgent
          tag: "ventilation_overload_{{ room }}"
          title: "⚠️ Перегрузка привода Drivent ({{ info.label }})"
          message: >
            Привод обнаружил перегрузку. Проверьте:
            - не зажато ли что-то в окне
            - открывается ли окно без заеданий
            - не заблокирована ли ручка

            Текущий CO2 ({{ info.label }}): {{ info.co2 }} ppm
            Позиция окна: {{ info.position }}%

# ──────────────────────────────────────────────────────────────────────────────
#  AUTOMATIONS (тонкие обёртки для комнат на общем движке)
# ──────────────────────────────────────────────────────────────────────────────

automation:
  # ══ ZAP ═════════════════════════════════════════════════════════════════════
  - id: "Управление вентиляцией по CO2"
    alias: ventilation_control_main
    mode: single
    max_exceeded: silent
    initial_state: true

    trigger:
      - platform: time_pattern
        minutes: "/30"

    condition:
      - condition: template
        value_template: >
          {% from 'ventilation.jinja' import eval_control_gate %}
          {{ (eval_control_gate('zap') | from_json).allowed }}

    action:
      - service: script.ventilation_apply_room_control
        data:
          room: "zap"

  - id: "Аварийное закрытие окна"
    alias: ventilation_safety_close
    mode: single
    max_exceeded: silent
    initial_state: true

    trigger:
      - platform: template
        value_template: >
          {% from 'ventilation.jinja' import eval_safety_close %}
          {{ (eval_safety_close('zap') | from_json).temp_unsafe }}
        for:
          seconds: 15
        id: "cold"

      - platform: state
        entity_id: binary_sensor.drivent_zap_left_datchik_peregruzki
        to: "on"
        id: "overload"

      - platform: state
        entity_id: binary_sensor.drivent_zap_back_datchik_peregruzki
        to: "on"
        id: "overload"

      - platform: state
        entity_id: sensor.sensor_zap_co2
        to: "unavailable"
        for:
          minutes: 2
        id: "co2_lost"

      - platform: time_pattern
        minutes: "/10"
        id: "periodic"

    condition:
      - condition: template
        value_template: >
          {% from 'ventilation.jinja' import eval_safety_close %}
          {{ (eval_safety_close('zap') | from_json).should_close }}

    action:
      - service: script.ventilation_apply_safety_close
        data:
          room: "zap"

  - id: "Ошибка привода окна"
    alias: ventilation_device_error
    mode: single
    initial_state: true

    trigger:
      - platform: state
        entity_id: binary_sensor.drivent_zap_left_datchik_peregruzki
        to: "on"

      - platform: state
        entity_id: binary_sensor.drivent_zap_back_datchik_peregruzki
        to: "on"

    action:
      - service: script.ventilation_notify_device_error
        data:
          room: "zap"

  # ══ EVA ═════════════════════════════════════════════════════════════════════
  - id: "Управление вентиляцией по CO2 eva"
    alias: ventilation_eva_control_main
    mode: single
    max_exceeded: silent
    initial_state: true

    trigger:
      - platform: time_pattern
        minutes: "/30"

    condition:
      - condition: template
        value_template: >
          {% from 'ventilation.jinja' import eval_control_gate %}
          {{ (eval_control_gate('eva') | from_json).allowed }}

    action:
      - service: script.ventilation_apply_room_control
        data:
          room: "eva"

  - id: "Аварийное закрытие окна eva"
    alias: ventilation_eva_safety_close
    mode: single
    max_exceeded: silent
    initial_state: true

    trigger:
      - platform: template
        value_template: >
          {% from 'ventilation.jinja' import eval_safety_close %}
          {{ (eval_safety_close('eva') | from_json).temp_unsafe }}
        for:
          seconds: 15
        id: "cold"

      - platform: state
        entity_id: binary_sensor.drivent_eva_datchik_peregruzki
        to: "on"
        id: "overload"

      - platform: state
        entity_id: sensor.sensor_eva_co2
        to: "unavailable"
        for:
          minutes: 2
        id: "co2_lost"

      - platform: time_pattern
        minutes: "/10"
        id: "periodic"

    condition:
      - condition: template
        value_template: >
          {% from 'ventilation.jinja' import eval_safety_close %}
          {{ (eval_safety_close('eva') | from_json).should_close }}

    action:
      - service: script.ventilation_apply_safety_close
        data:
          room: "eva"

  - id: "Ошибка привода окна eva"
    alias: ventilation_eva_device_error
    mode: single
    initial_state: true

    trigger:
      - platform: state
        entity_id: binary_sensor.drivent_eva_datchik_peregruzki
        to: "on"

    action:
      - service: script.ventilation_notify_device_error
        data:
          room: "eva"
