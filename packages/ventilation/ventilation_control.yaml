# package: ventilation_multiroom
# Version: 2.4.0
# Last Updated: 2026-09-04
# Description: ZAP setpoint-tracking thermal cap and low-CO2 ceiling; EVA unchanged
#
# АЛГОРИТМ: Отдельный room-local PI-style controller для каждой комнаты.
# Controller layer считает demand непрерывно по filtered CO2 error,
# а actuator layer отдельно применяет это demand не чаще одного раза в 30 минут.
# Коэффициенты не задаются руками — они оцениваются из наблюдаемой динамики комнаты.
#
# РЕСУРС ПРИВОДА: WindowMaster рейтинг ~10 000 циклов.
# С длинным тренд-фильтром: реальных движений заметно меньше, чем при коротком шумном контуре.
# Drivent V2 магнитный датчик надёжнее V1 — реальный ресурс выше.

# ──────────────────────────────────────────────────────────────────────────────
#  INPUT NUMBERS (настройки регулирования)
# ──────────────────────────────────────────────────────────────────────────────

input_number:
  # Zap room (legacy/default entity names stay attached here for compatibility)
  ventilation_target_co2:
    name: "Ventilation Target CO2"
    min: 300
    max: 1000
    step: 50
    unit_of_measurement: "ppm"
    icon: mdi:molecule-co2
    mode: box

  ventilation_min_position:
    name: "Ventilation Min Position"
    min: 0
    max: 50
    step: 5
    unit_of_measurement: "%"
    icon: mdi:arrow-collapse-down
    mode: box

  ventilation_max_position:
    name: "Ventilation Max Position"
    min: 2
    max: 100
    step: 5
    unit_of_measurement: "%"
    icon: mdi:arrow-collapse-up
    mode: box

  ventilation_min_outdoor_temp:
    name: "Ventilation Min Outdoor Temp"
    min: -30
    max: 10
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:thermometer-alert
    mode: box

  ventilation_min_indoor_temp:
    name: "Ventilation Min Indoor Temp"
    min: 10
    max: 25
    step: 0.5
    initial: 16
    unit_of_measurement: "°C"
    icon: mdi:home-thermometer
    mode: box

  ventilation_deadband_ppm:
    name: "Ventilation Deadband PPM"
    min: 10
    max: 150
    step: 5
    initial: 50
    unit_of_measurement: "ppm"
    icon: mdi:arrow-left-right
    mode: box

  ventilation_eva_target_co2:
    name: "Ventilation Eva Target CO2"
    min: 300
    max: 1000
    step: 50
    initial: 650
    unit_of_measurement: "ppm"
    icon: mdi:molecule-co2
    mode: box

  ventilation_eva_min_position:
    name: "Ventilation Eva Min Position"
    min: 0
    max: 50
    step: 5
    unit_of_measurement: "%"
    icon: mdi:arrow-collapse-down
    mode: box

  ventilation_eva_max_position:
    name: "Ventilation Eva Max Position"
    min: 2
    max: 100
    step: 5
    unit_of_measurement: "%"
    icon: mdi:arrow-collapse-up
    mode: box

  ventilation_eva_min_outdoor_temp:
    name: "Ventilation Eva Min Outdoor Temp"
    min: -30
    max: 10
    step: 1
    initial: -10
    unit_of_measurement: "°C"
    icon: mdi:thermometer-alert
    mode: box

  ventilation_eva_deadband_ppm:
    name: "Ventilation Eva Deadband PPM"
    min: 10
    max: 150
    step: 5
    initial: 50
    unit_of_measurement: "ppm"
    icon: mdi:arrow-left-right
    mode: box

input_boolean:
  ventilation_use_indoor_temperature:
    name: "Ventilation Use Indoor Temperature"
    icon: mdi:home-thermometer-outline
    initial: true

input_datetime:
  ventilation_last_adjustment:
    name: "Ventilation Last Adjustment"
    has_date: true
    has_time: true
    icon: mdi:clock-check-outline
    initial: "2000-01-01 00:00:00"

  ventilation_eva_last_adjustment:
    name: "Ventilation Eva Last Adjustment"
    has_date: true
    has_time: true
    icon: mdi:clock-check-outline
    initial: "2000-01-01 00:00:00"

# ──────────────────────────────────────────────────────────────────────────────
#  GROUPED COVERS (логические приводы комнаты)
# ──────────────────────────────────────────────────────────────────────────────

cover:
  - platform: group
    name: "Ventilation Zap Group"
    unique_id: ventilation_zap_group
    entities:
      - cover.drivent_zap_left_driventokonnyi_privod
      - cover.drivent_zap_back_driventokonnyi_privod

# ──────────────────────────────────────────────────────────────────────────────
#  STATISTICS SENSORS (сглаживание и длинный тренд CO2)
# ──────────────────────────────────────────────────────────────────────────────

sensor:
  - platform: statistics
    name: "Ventilation CO2 Mean 30m"
    unique_id: ventilation_co2_mean_30m
    entity_id: sensor.sensor_zap_co2
    state_characteristic: average_step
    max_age:
      minutes: 30
    sampling_size: 240
    keep_last_sample: true
    precision: 1

  - platform: statistics
    name: "Ventilation CO2 Change 30m"
    unique_id: ventilation_co2_change_30m
    entity_id: sensor.sensor_zap_co2
    state_characteristic: change
    max_age:
      minutes: 30
    sampling_size: 240
    keep_last_sample: true
    precision: 1

  - platform: statistics
    name: "Ventilation Eva CO2 Mean 30m"
    unique_id: ventilation_eva_co2_mean_30m
    entity_id: sensor.sensor_eva_co2
    state_characteristic: average_step
    max_age:
      minutes: 30
    sampling_size: 240
    keep_last_sample: true
    precision: 1

  - platform: statistics
    name: "Ventilation Eva CO2 Change 30m"
    unique_id: ventilation_eva_co2_change_30m
    entity_id: sensor.sensor_eva_co2
    state_characteristic: change
    max_age:
      minutes: 30
    sampling_size: 240
    keep_last_sample: true
    precision: 1

  - platform: filter
    name: "Ventilation CO2 Filtered"
    unique_id: ventilation_co2_filtered
    entity_id: sensor.sensor_zap_co2
    filters:
      - filter: lowpass
        time_constant: 8
        precision: 1

  - platform: filter
    name: "Ventilation Eva CO2 Filtered"
    unique_id: ventilation_eva_co2_filtered
    entity_id: sensor.sensor_eva_co2
    filters:
      - filter: lowpass
        time_constant: 8
        precision: 1

  - platform: derivative
    source: sensor.ventilation_co2_filtered
    name: "Ventilation CO2 Slope"
    unique_id: ventilation_co2_slope
    round: 3
    unit_time: min
    time_window: "00:15:00"

  - platform: derivative
    source: sensor.ventilation_eva_co2_filtered
    name: "Ventilation Eva CO2 Slope"
    unique_id: ventilation_eva_co2_slope
    round: 3
    unit_time: min
    time_window: "00:15:00"

# ──────────────────────────────────────────────────────────────────────────────
#  TEMPLATE SENSORS
# ──────────────────────────────────────────────────────────────────────────────

template:
  # ════════════════════════════════════════════════════════════════════════════
  #  БЛОК 1: ДОЛГИЙ ТРЕНД CO2 (30-минутное изменение + сглаженное среднее)
  # ════════════════════════════════════════════════════════════════════════════
  - trigger:
      - platform: time_pattern
        minutes: "/1"
      - platform: state
        entity_id:
          - sensor.ventilation_co2_filtered
          - sensor.ventilation_co2_slope
      - platform: homeassistant
        event: start
    sensor:
      - name: "CO2 Trend"
        unique_id: ventilation_co2_trend
        icon: mdi:trending-up
        availability: >
          {{ has_value('sensor.sensor_zap_co2') and
             has_value('sensor.ventilation_co2_filtered') and
             has_value('sensor.ventilation_co2_slope') }}
        state: >
          {% set slope = states('sensor.ventilation_co2_slope') | float(0) %}
          {% set trend_threshold = 0.5 %}
          {% if slope > trend_threshold %}
            rising
          {% elif slope < -trend_threshold %}
            falling
          {% else %}
            stable
          {% endif %}
        attributes:
          current_co2: "{{ states('sensor.sensor_zap_co2') | float(0) }}"
          co2_filtered: "{{ states('sensor.ventilation_co2_filtered') | float(0) }}"
          co2_slope_ppm_min: "{{ states('sensor.ventilation_co2_slope') | float(0) }}"
          trend_threshold_ppm_min: 0.5
          filter_type: "ema_lowpass"

  # ════════════════════════════════════════════════════════════════════════════
  #  БЛОК 2: ZAP — модель комнаты по завершённым 30-минутным циклам
  # ════════════════════════════════════════════════════════════════════════════
  - trigger:
      - platform: time_pattern
        minutes: "/1"
        id: observation
      - platform: time_pattern
        minutes: "29"
        id: cycle_end
      - platform: time_pattern
        minutes: "59"
        id: cycle_end
      - platform: homeassistant
        event: start
        id: startup
    sensor:
      - name: "Ventilation ZAP Room Model"
        unique_id: ventilation_zap_room_model
        unit_of_measurement: "%"
        icon: mdi:chart-bell-curve-cumulative
        state: >
          {% set load_count = state_attr('sensor.ventilation_zap_room_model', 'load_sample_count') | int(0) %}
          {% set gain_count = state_attr('sensor.ventilation_zap_room_model', 'gain_sample_count') | int(0) %}
          {% set tau_count = state_attr('sensor.ventilation_zap_room_model', 'tau_sample_count') | int(0) %}
          {% set confidence = [load_count / 4, gain_count / 6, tau_count / 4, 1] | min %}
          {{ (confidence * 100) | round(0) }}
        attributes:
          model_generation: 2
          model_state: >
            {% set load_count = state_attr('sensor.ventilation_zap_room_model', 'load_sample_count') | int(0) %}
            {% set gain_count = state_attr('sensor.ventilation_zap_room_model', 'gain_sample_count') | int(0) %}
            {% set tau_count = state_attr('sensor.ventilation_zap_room_model', 'tau_sample_count') | int(0) %}
            {{ 'ready' if load_count >= 4 and gain_count >= 6 and tau_count >= 4 else 'learning' }}
          closed_load_estimate_ppm_min: >
            {% set previous = state_attr('sensor.ventilation_zap_room_model', 'closed_load_estimate_ppm_min') | float(0.2) %}
            {% set count = state_attr('sensor.ventilation_zap_room_model', 'load_sample_count') | int(0) %}
            {% set min_pos = states('input_number.ventilation_min_position') | float(0) %}
            {% set max_pos = states('input_number.ventilation_max_position') | float(80) %}
            {% set span = [max_pos - min_pos, 1] | max %}
            {% set applied = state_attr('cover.ventilation_zap_group', 'current_position') | float(min_pos) %}
            {% set fraction = [[(applied - min_pos) / span, 0] | max, 1] | min %}
            {% set slope = states('sensor.ventilation_co2_slope') | float(0) %}
            {% set last_ts = as_timestamp(states('input_datetime.ventilation_last_adjustment')) | float(0) %}
            {% set stable = (as_timestamp(now()) - last_ts) >= 900 %}
            {% set previous_target = state_attr('sensor.ventilation_zap_room_model', 'last_target') | float(states('input_number.ventilation_target_co2') | float(650)) %}
            {% set target = states('input_number.ventilation_target_co2') | float(650) %}
            {% set previous_min = state_attr('sensor.ventilation_zap_room_model', 'last_min_position') | float(min_pos) %}
            {% set previous_max = state_attr('sensor.ventilation_zap_room_model', 'last_max_position') | float(max_pos) %}
            {% set settings_same = previous_target == target and previous_min == min_pos and previous_max == max_pos %}
            {% set eligible = trigger.id == 'cycle_end' and stable and settings_same and has_value('sensor.ventilation_co2_slope') and is_state('binary_sensor.drivent_zap_left_datchik_peregruzki', 'off') and is_state('binary_sensor.drivent_zap_back_datchik_peregruzki', 'off') %}
            {% set previous_gain = state_attr('sensor.ventilation_zap_room_model', 'ventilation_gain_estimate_ppm_min_per_fraction') | float(0.8) %}
            {% set raw_sample = slope + previous_gain * fraction %}
            {% set sample = [[raw_sample, 0] | max, 20] | min %}
            {% set accepted = eligible and raw_sample >= 0 and raw_sample <= 20 and (count < 3 or (sample <= [previous * 4, 1] | max and sample >= [previous / 4, 0] | max)) %}
            {% set weight = [count, 9] | min %}
            {{ (((previous * weight + sample) / (weight + 1)) if accepted else previous) | round(3) }}
          ventilation_gain_estimate_ppm_min_per_fraction: >
            {% set previous = state_attr('sensor.ventilation_zap_room_model', 'ventilation_gain_estimate_ppm_min_per_fraction') | float(0.8) %}
            {% set load = state_attr('sensor.ventilation_zap_room_model', 'accepted_closed_load_estimate_ppm_min') | float(2.597) %}
            {% set count = state_attr('sensor.ventilation_zap_room_model', 'gain_sample_count') | int(0) %}
            {% set min_pos = states('input_number.ventilation_min_position') | float(0) %}
            {% set max_pos = states('input_number.ventilation_max_position') | float(80) %}
            {% set span = [max_pos - min_pos, 1] | max %}
            {% set applied = state_attr('cover.ventilation_zap_group', 'current_position') | float(min_pos) %}
            {% set fraction = [[(applied - min_pos) / span, 0] | max, 1] | min %}
            {% set slope = states('sensor.ventilation_co2_slope') | float(0) %}
            {% set last_ts = as_timestamp(states('input_datetime.ventilation_last_adjustment')) | float(0) %}
            {% set stable = (as_timestamp(now()) - last_ts) >= 900 %}
            {% set previous_target = state_attr('sensor.ventilation_zap_room_model', 'last_target') | float(states('input_number.ventilation_target_co2') | float(650)) %}
            {% set target = states('input_number.ventilation_target_co2') | float(650) %}
            {% set previous_min = state_attr('sensor.ventilation_zap_room_model', 'last_min_position') | float(min_pos) %}
            {% set previous_max = state_attr('sensor.ventilation_zap_room_model', 'last_max_position') | float(max_pos) %}
            {% set settings_same = previous_target == target and previous_min == min_pos and previous_max == max_pos %}
            {% set raw_sample = ((load - slope) / fraction) if fraction >= 0.15 else previous %}
            {% set sample = [[raw_sample, 0.05] | max, 100] | min %}
            {% set eligible = trigger.id == 'cycle_end' and stable and settings_same and fraction >= 0.15 and raw_sample > 0.05 and has_value('sensor.ventilation_co2_slope') and is_state('binary_sensor.drivent_zap_left_datchik_peregruzki', 'off') and is_state('binary_sensor.drivent_zap_back_datchik_peregruzki', 'off') %}
            {% set accepted = eligible and (count < 3 or (sample <= [previous * 4, 1] | max and sample >= [previous / 4, 0.05] | max)) %}
            {% set weight = [count, 9] | min %}
            {{ (((previous * weight + sample) / (weight + 1)) if accepted else previous) | round(3) }}
          tau_estimate_min: >
            {% set previous = state_attr('sensor.ventilation_zap_room_model', 'tau_estimate_min') | float(25) %}
            {% set count = state_attr('sensor.ventilation_zap_room_model', 'tau_sample_count') | int(0) %}
            {% set filtered = states('sensor.ventilation_co2_filtered') | float(650) %}
            {% set target = states('input_number.ventilation_target_co2') | float(650) %}
            {% set error = filtered - target %}
            {% set slope = states('sensor.ventilation_co2_slope') | float(0) %}
            {% set last_ts = as_timestamp(states('input_datetime.ventilation_last_adjustment')) | float(0) %}
            {% set stable = (as_timestamp(now()) - last_ts) >= 900 %}
            {% set raw_sample = ((error | abs) / ([slope | abs, 0.05] | max)) if error * slope < 0 and (error | abs) >= 25 else previous %}
            {% set sample = [[raw_sample, 6] | max, 180] | min %}
            {% set previous_target = state_attr('sensor.ventilation_zap_room_model', 'last_target') | float(target) %}
            {% set eligible = trigger.id == 'cycle_end' and stable and previous_target == target and error * slope < 0 and (error | abs) >= 25 and has_value('sensor.ventilation_co2_slope') %}
            {% set accepted = eligible and (count < 3 or (sample <= previous * 4 and sample >= previous / 4)) %}
            {% set weight = [count, 9] | min %}
            {{ (((previous * weight + sample) / (weight + 1)) if accepted else previous) | round(2) }}
          accepted_closed_load_estimate_ppm_min: >
            {% set previous = state_attr('sensor.ventilation_zap_room_model', 'accepted_closed_load_estimate_ppm_min') | float(2.597) %}
            {% set l = state_attr('sensor.ventilation_zap_room_model', 'load_sample_count') | int(0) %}
            {% set g = state_attr('sensor.ventilation_zap_room_model', 'gain_sample_count') | int(0) %}
            {% set t = state_attr('sensor.ventilation_zap_room_model', 'tau_sample_count') | int(0) %}
            {% set total = l + g + t %}
            {% set accepted_total = state_attr('sensor.ventilation_zap_room_model', 'accepted_total_sample_count') | int(0) %}
            {% set promote = trigger.id == 'cycle_end' and l >= 4 and g >= 6 and t >= 4 and total > accepted_total %}
            {{ state_attr('sensor.ventilation_zap_room_model', 'closed_load_estimate_ppm_min') | float(previous) if promote else previous }}
          accepted_ventilation_gain_estimate_ppm_min_per_fraction: >
            {% set previous = state_attr('sensor.ventilation_zap_room_model', 'accepted_ventilation_gain_estimate_ppm_min_per_fraction') | float(6.681) %}
            {% set l = state_attr('sensor.ventilation_zap_room_model', 'load_sample_count') | int(0) %}
            {% set g = state_attr('sensor.ventilation_zap_room_model', 'gain_sample_count') | int(0) %}
            {% set t = state_attr('sensor.ventilation_zap_room_model', 'tau_sample_count') | int(0) %}
            {% set total = l + g + t %}
            {% set accepted_total = state_attr('sensor.ventilation_zap_room_model', 'accepted_total_sample_count') | int(0) %}
            {% set promote = trigger.id == 'cycle_end' and l >= 4 and g >= 6 and t >= 4 and total > accepted_total %}
            {{ state_attr('sensor.ventilation_zap_room_model', 'ventilation_gain_estimate_ppm_min_per_fraction') | float(previous) if promote else previous }}
          accepted_tau_estimate_min: >
            {% set previous = state_attr('sensor.ventilation_zap_room_model', 'accepted_tau_estimate_min') | float(30.715) %}
            {% set l = state_attr('sensor.ventilation_zap_room_model', 'load_sample_count') | int(0) %}
            {% set g = state_attr('sensor.ventilation_zap_room_model', 'gain_sample_count') | int(0) %}
            {% set t = state_attr('sensor.ventilation_zap_room_model', 'tau_sample_count') | int(0) %}
            {% set total = l + g + t %}
            {% set accepted_total = state_attr('sensor.ventilation_zap_room_model', 'accepted_total_sample_count') | int(0) %}
            {% set promote = trigger.id == 'cycle_end' and l >= 4 and g >= 6 and t >= 4 and total > accepted_total %}
            {{ state_attr('sensor.ventilation_zap_room_model', 'tau_estimate_min') | float(previous) if promote else previous }}
          accepted_model_generation: >
            {% set previous = state_attr('sensor.ventilation_zap_room_model', 'accepted_model_generation') | int(0) %}
            {% set l = state_attr('sensor.ventilation_zap_room_model', 'load_sample_count') | int(0) %}
            {% set g = state_attr('sensor.ventilation_zap_room_model', 'gain_sample_count') | int(0) %}
            {% set t = state_attr('sensor.ventilation_zap_room_model', 'tau_sample_count') | int(0) %}
            {% set total = l + g + t %}
            {% set accepted_total = state_attr('sensor.ventilation_zap_room_model', 'accepted_total_sample_count') | int(0) %}
            {{ previous + 1 if trigger.id == 'cycle_end' and l >= 4 and g >= 6 and t >= 4 and total > accepted_total else previous }}
          accepted_total_sample_count: >
            {% set previous = state_attr('sensor.ventilation_zap_room_model', 'accepted_total_sample_count') | int(0) %}
            {% set l = state_attr('sensor.ventilation_zap_room_model', 'load_sample_count') | int(0) %}
            {% set g = state_attr('sensor.ventilation_zap_room_model', 'gain_sample_count') | int(0) %}
            {% set t = state_attr('sensor.ventilation_zap_room_model', 'tau_sample_count') | int(0) %}
            {% set total = l + g + t %}
            {{ total if trigger.id == 'cycle_end' and l >= 4 and g >= 6 and t >= 4 and total > previous else previous }}
          coefficient_source: >
            {{ 'last_known_good' if state_attr('sensor.ventilation_zap_room_model', 'accepted_model_generation') | int(0) > 0 else 'history_bootstrap' }}
          load_sample_count: >
            {% set count = state_attr('sensor.ventilation_zap_room_model', 'load_sample_count') | int(0) %}
            {% set previous = state_attr('sensor.ventilation_zap_room_model', 'closed_load_estimate_ppm_min') | float(0.2) %}
            {% set min_pos = states('input_number.ventilation_min_position') | float(0) %}
            {% set max_pos = states('input_number.ventilation_max_position') | float(80) %}
            {% set span = [max_pos - min_pos, 1] | max %}
            {% set applied = state_attr('cover.ventilation_zap_group', 'current_position') | float(min_pos) %}
            {% set fraction = [[(applied - min_pos) / span, 0] | max, 1] | min %}
            {% set slope = states('sensor.ventilation_co2_slope') | float(0) %}
            {% set previous_gain = state_attr('sensor.ventilation_zap_room_model', 'ventilation_gain_estimate_ppm_min_per_fraction') | float(0.8) %}
            {% set raw_sample = slope + previous_gain * fraction %}
            {% set sample = [[raw_sample, 0] | max, 20] | min %}
            {% set last_ts = as_timestamp(states('input_datetime.ventilation_last_adjustment')) | float(0) %}
            {% set previous_target = state_attr('sensor.ventilation_zap_room_model', 'last_target') | float(states('input_number.ventilation_target_co2') | float(650)) %}
            {% set target = states('input_number.ventilation_target_co2') | float(650) %}
            {% set previous_min = state_attr('sensor.ventilation_zap_room_model', 'last_min_position') | float(min_pos) %}
            {% set previous_max = state_attr('sensor.ventilation_zap_room_model', 'last_max_position') | float(max_pos) %}
            {% set settings_same = previous_target == target and previous_min == min_pos and previous_max == max_pos %}
            {% set eligible = trigger.id == 'cycle_end' and (as_timestamp(now()) - last_ts) >= 900 and settings_same and has_value('sensor.ventilation_co2_slope') and is_state('binary_sensor.drivent_zap_left_datchik_peregruzki', 'off') and is_state('binary_sensor.drivent_zap_back_datchik_peregruzki', 'off') %}
            {% set accepted = eligible and raw_sample >= 0 and raw_sample <= 20 and (count < 3 or (sample <= [previous * 4, 1] | max and sample >= [previous / 4, 0] | max)) %}
            {{ ([count + (1 if accepted else 0), 10000] | min) | int }}
          gain_sample_count: >
            {% set count = state_attr('sensor.ventilation_zap_room_model', 'gain_sample_count') | int(0) %}
            {% set previous = state_attr('sensor.ventilation_zap_room_model', 'ventilation_gain_estimate_ppm_min_per_fraction') | float(0.8) %}
            {% set load = state_attr('sensor.ventilation_zap_room_model', 'accepted_closed_load_estimate_ppm_min') | float(2.597) %}
            {% set min_pos = states('input_number.ventilation_min_position') | float(0) %}
            {% set max_pos = states('input_number.ventilation_max_position') | float(80) %}
            {% set span = [max_pos - min_pos, 1] | max %}
            {% set applied = state_attr('cover.ventilation_zap_group', 'current_position') | float(min_pos) %}
            {% set fraction = [[(applied - min_pos) / span, 0] | max, 1] | min %}
            {% set slope = states('sensor.ventilation_co2_slope') | float(0) %}
            {% set raw_sample = ((load - slope) / fraction) if fraction >= 0.15 else previous %}
            {% set sample = [[raw_sample, 0.05] | max, 100] | min %}
            {% set last_ts = as_timestamp(states('input_datetime.ventilation_last_adjustment')) | float(0) %}
